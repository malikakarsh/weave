<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #0f1117;
      color: #e2e8f0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding-bottom: 16px;
    }

    #chart {
      position: relative;
      padding: 32px;
      background: #1a1d27;
      border-radius: 16px;
      box-shadow: 0 4px 32px rgba(0,0,0,0.4);
    }

    .chart-actions {
      position: absolute;
      top: 16px;
      right: 16px;
      display: flex;
      gap: 8px;
    }

    .chart-actions button {
      background: #252836;
      color: #94a3b8;
      border: 1px solid #2d3148;
      border-radius: 6px;
      padding: 6px 12px;
      font-size: 12px;
      cursor: pointer;
      transition: background 0.15s, color 0.15s;
    }

    .chart-actions button:hover { background: #2d3148; color: #e2e8f0; }
    .chart-actions button.success { color: #4ade80; border-color: #4ade80; }
    .chart-actions button.active  { color: #e2e8f0; background: #2d3148; }

    #edit-panel {
      display: none;
      position: absolute;
      top: 52px;
      right: 16px;
      background: #252836;
      border: 1px solid #2d3148;
      border-radius: 8px;
      padding: 12px 16px;
      flex-direction: column;
      gap: 10px;
      z-index: 10;
      min-width: 180px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.3);
    }
    #edit-panel.open { display: flex; }
    .edit-row { display: flex; align-items: center; justify-content: space-between; gap: 24px; }
    .edit-label { color: #94a3b8; font-size: 12px; white-space: nowrap; }
    .color-pick {
      width: 32px; height: 22px;
      padding: 1px 2px;
      background: #1a1d27;
      border: 1px solid #2d3148;
      border-radius: 4px;
      cursor: pointer;
    }
    .edit-divider { border-top: 1px solid #2d3148; margin: 2px 0; }
    .edit-btn-group { display: flex; gap: 4px; }
    .edit-btn {
      background: #1a1d27;
      color: #94a3b8;
      border: 1px solid #2d3148;
      border-radius: 4px;
      padding: 3px 10px;
      font-size: 13px;
      cursor: pointer;
    }
    .edit-btn:hover { background: #2d3148; color: #e2e8f0; }
    .edit-hint { color: #475569; font-size: 11px; font-style: italic; }
    .edit-text {
      background: #1a1d27;
      color: #e2e8f0;
      border: 1px solid #2d3148;
      border-radius: 4px;
      padding: 3px 8px;
      font-size: 12px;
      width: 110px;
      outline: none;
    }
    .edit-text:focus { border-color: #4f5680; }

    .axis path, .axis line { stroke: #2d3148; }
    .axis text { fill: #64748b; font-size: 12px; }
    .grid line { stroke: #1e2235; stroke-dasharray: 4 4; }
    .grid path { stroke: none; }

    .bar { cursor: pointer; transition: opacity 0.1s; }
    .bar:hover { opacity: 0.75; }

    .tooltip {
      position: absolute;
      background: #252836;
      border: 1px solid #2d3148;
      border-radius: 8px;
      padding: 10px 14px;
      font-size: 13px;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.1s;
      min-width: 140px;
    }

    .tooltip .tip-date  { color: #64748b; font-size: 11px; margin-bottom: 6px; }
    .tooltip .tip-row   { display: flex; align-items: center; gap: 6px; margin-top: 3px; }
    .tooltip .tip-swatch { width: 8px; height: 8px; border-radius: 2px; flex-shrink: 0; }
    .tooltip .tip-label { color: #94a3b8; flex: 1; }
    .tooltip .tip-val   { color: #e2e8f0; font-weight: 600; }

  </style>
</head>
<body>
  <div id="chart">
    <div class="chart-actions">
      <button id="btn-edit">Edit</button>
      <button id="btn-copy">Copy SVG</button>
      <button id="btn-download">Download SVG</button>
    </div>
    <div id="edit-panel">
      <div class="edit-row">
        <span class="edit-label">SVG Background</span>
        <input type="color" class="color-pick" id="pick-svg-bg">
      </div>
      <div class="edit-divider"></div>
      <div class="edit-row">
        <span class="edit-label">Chart Size</span>
        <div class="edit-btn-group">
          <button class="edit-btn" id="ep-smaller">−</button>
          <button class="edit-btn" id="ep-larger">+</button>
        </div>
      </div>
      <div class="edit-divider"></div>
      <div class="edit-row">
        <span class="edit-label">Title</span>
        <input type="text" class="edit-text" id="edit-title" placeholder="Chart title">
      </div>
      <div class="edit-row">
        <span class="edit-label">X Label</span>
        <input type="text" class="edit-text" id="edit-xlabel" placeholder="x-axis label">
      </div>
      <div class="edit-row">
        <span class="edit-label">Y Label</span>
        <input type="text" class="edit-text" id="edit-ylabel" placeholder="y-axis label">
      </div>
      <div class="edit-divider"></div>
      <span class="edit-hint">Click any bar to change its color</span>
    </div>
  </div>
  <input type="color" id="floating-color-pick" style="position:fixed;opacity:0;pointer-events:none;width:0;height:0;left:-200px;top:-200px">
  <div class="tooltip" id="tooltip"></div>

  __CONTROLS_RUNTIME__
  <script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
  <script>
    const raw    = __DATA__;
    const config = __CONFIG__;
    window.__weaveConfig = config;

    const markScale = config.mark_scale || 1;   // multiplier for bar width
    // Scaled bar width within a band, capped at the full step so bars can widen
    // into the gap but never overlap; returns [width, leftOffset] to keep centered.
    const _barW = (band, step) => Math.min(band * markScale, step);
    const _barDx = (band, step) => (band - _barW(band, step)) / 2;

    let svgBg   = config.svg_bg || "#1a1d27";
    let editMode = false;
    let activeSeries = null; // null = single series, string = group name

    const floatingPick = document.getElementById("floating-color-pick");
    floatingPick.addEventListener("input", e => {
      const color = e.target.value;
      if (activeSeries && activeSeries.startsWith("__x__")) {
        // flat bar — recolor only the clicked bar by its x value
        g.selectAll(`rect[data-x="${CSS.escape(activeSeries.slice(5))}"]`).attr("fill", color);
      } else if (activeSeries) {
        g.selectAll(`rect[data-group="${CSS.escape(activeSeries)}"]`).attr("fill", color);
        svg.selectAll(`.legend-swatch[data-group="${CSS.escape(activeSeries)}"]`).attr("fill", color);
      }
    });

    function highlightGroup(group) {
      if (!isGrouped) return; // single series — nothing to fade
      groups.forEach(grp => {
        const active = grp === group;
        g.selectAll(`rect[data-group="${CSS.escape(grp)}"]`).attr("opacity", active ? 1 : 0.15);
        svg.selectAll(`.legend-swatch[data-group="${CSS.escape(grp)}"]`).attr("opacity", active ? 1 : 0.15);
      });
    }

    function clearHighlight() {
      g.selectAll(".bar").attr("opacity", 1);
      svg.selectAll(".legend-swatch").attr("opacity", 1);
    }

    function openColorPicker(currentColor, series, event) {
      activeSeries = series;
      floatingPick.value = toPickerHex(currentColor);
      floatingPick.style.left = event.clientX + "px";
      floatingPick.style.top  = event.clientY + "px";
      floatingPick.getBoundingClientRect(); // flush layout so position applies before picker opens
      floatingPick.click();
    }

    // Convert any CSS color string to a 6-digit hex for <input type="color">
    function toPickerHex(color) {
      if (/^#[0-9a-f]{6}$/i.test(color)) return color;
      const tmp = Object.assign(document.createElement("div"), { style: `color:${color};position:fixed;opacity:0` });
      document.body.appendChild(tmp);
      const rgb = getComputedStyle(tmp).color;
      document.body.removeChild(tmp);
      const m = rgb.match(/\d+/g);
      return m ? "#" + m.slice(0,3).map(v => (+v).toString(16).padStart(2,"0")).join("") : "#6366f1";
    }

    // ── Interactive filter controls ───────────────────────────────────────────
    // The server ships one pre-aggregated slice per scrub value (e.g. per year) and
    // the bounds for each min-threshold. Filtering is entirely client-side: a scrub
    // slider swaps which slice is drawn; a min slider hides bars below the chosen
    // measure value. `raw` is the default slice, so the chart opens on a valid view.
    const controls = __CONTROLS__;
    const minCtls  = controls ? controls.controls.filter(c => c.kind === "min") : [];
    const slices   = (controls && controls.slices) || {};
    const _hasSlices = controls && controls.slices && Object.keys(controls.slices).length > 0;

    let currentData = raw;
    const minState = window.WeaveControls ? window.WeaveControls.initMinState(controls) : {};

    const dataIsGrouped = d => Array.isArray(d) && d.length > 0 && "group" in d[0];

    const palette    = config.palette || d3.range(20).map(i => d3.hcl(230 + i * 137.508, 68, 65).formatHex());
    const catColors  = config.category_colors || {};
    function resolveColor(key, fallback) {
      if (catColors[key]) return catColors[key];
      const kl = (key || "").toLowerCase();
      for (const [ck, cv] of Object.entries(catColors)) {
        if (ck.toLowerCase() === kl) return cv;   // exact (case-insensitive) — avoids 'Good' matching 'Very Good'
      }
      return fallback;
    }
    // Color domain spans EVERY slice's groups so a series keeps its color as you scrub.
    const allSlices = _hasSlices ? Object.values(slices) : [raw];
    const allGroups = [...new Set(allSlices.flatMap(d => dataIsGrouped(d) ? d.map(g => g.group) : []))];
    const _baseCS   = allGroups.length ? d3.scaleOrdinal(palette).domain(allGroups) : () => config.color;
    // Flat charts color per category when the user chose a palette; otherwise
    // the single accent color as before.
    const _flatCS   = config.palette ? d3.scaleOrdinal(config.palette) : null;
    const colorScale = key => resolveColor(key, _baseCS(key));
    const groupLabel = grp => (config.group_labels && config.group_labels[grp] != null) ? config.group_labels[grp] : grp;

    // Threshold filter: drop marks whose aggregated measure is below the max min-slider.
    function applyMins(data) {
      if (!minCtls.length) return data;
      const thr = Math.max(...minCtls.map(c => minState[c.column]));
      if (dataIsGrouped(data)) {
        return data.map(gp => ({ ...gp, values: gp.values.filter(v => (v.y ?? 0) >= thr) }))
                   .filter(gp => gp.values.length);
      }
      return data.filter(d => (d.y ?? 0) >= thr);
    }

    // ── Fixed layout from the union of all slices, so the frame doesn't jump ──
    const _statsN    = d => dataIsGrouped(d) ? (d[0] ? d[0].values.length : 0) : d.length;
    const _statsMaxY = d => d3.max(dataIsGrouped(d)
      ? d.flatMap(g => g.values.map(v => v.y)).filter(y => y !== null)
      : d.map(r => r.y).filter(y => y !== null)) || 0;
    const globalCats = d3.max(allSlices, _statsN) || 1;
    const maxY = (d3.max(allSlices, _statsMaxY) || 0) * 1.2;
    const widestTick = d3.format(config.y_format)(maxY);
    const leftMargin = Math.max(64, Math.min(widestTick.length * 7.5 + 40, 160));

    const legendWidth = allGroups.length ? 130 : 0;
    let manyCategories = globalCats > 20;
    let someCategories = globalCats > 6;
    const bottomMargin = manyCategories ? 150 : someCategories ? 110 : 72;
    const margin = { top: 32, right: 16 + legendWidth, bottom: bottomMargin, left: leftMargin };
    const totalWidth  = config.width;
    const totalHeight = config.height;
    const width  = totalWidth  - margin.left - margin.right;
    const height = totalHeight - margin.top  - margin.bottom;

    const chartEl = document.getElementById("chart");
    chartEl.style.width = (totalWidth + 64) + "px";

    const svg = d3.select("#chart")
      .append("svg")
      .attr("viewBox", `0 0 ${totalWidth} ${totalHeight}`)
      .attr("width", totalWidth)
      .attr("height", totalHeight);

    const g = svg.append("g").attr("transform", `translate(${margin.left},${margin.top})`);

    let barPadding = 0.2;
    // Reassigned on every draw; the edit-panel handlers read the latest.
    let xOuter, xInner, isGrouped, categories, groups, xAxisG, yAxisG;
    const yScale = d3.scaleLinear().domain([0, maxY]).nice().range([height, 0]);

    // Labels — created once so the edit panel can update them; positions refreshed per draw
    const titleEl = svg.append("text")
      .attr("x", (totalWidth - legendWidth) / 2).attr("y", 18)
      .attr("text-anchor", "middle")
      .attr("fill", "#e2e8f0").attr("font-size", "14px").attr("font-weight", "600")
      .text(config.title || "");

    const _prettify = s => s.replace(/_/g, " ").replace(/([a-z])([A-Z])/g, "$1 $2").trim().replace(/\b\w/g, c => c.toUpperCase());
    const _xLabel = config.x_label || (config.x_column ? _prettify(config.x_column) : "");
    const xLabelEl = svg.append("text")
      .attr("x", margin.left + width / 2).attr("y", totalHeight - 12)
      .attr("text-anchor", "middle").attr("fill", "#64748b").attr("font-size", "12px")
      .text(_xLabel);

    const yLabelEl = svg.append("text")
      .attr("transform", "rotate(-90)")
      .attr("x", -(margin.top + height / 2)).attr("y", 16)
      .attr("text-anchor", "middle").attr("fill", "#64748b").attr("font-size", "12px")
      .text(config.y_label || "");

    const tooltip = document.getElementById("tooltip");
    const formatY = d3.format(",.2f");

    function showTooltip(event, label, rows) {
      let html = `<div class="tip-date">${label}</div>`;
      rows.forEach(({ name, value, color }) => {
        html += `<div class="tip-row">
          <span class="tip-swatch" style="background:${color}"></span>
          <span class="tip-label">${name}</span>
          <span class="tip-val">${value !== null ? formatY(value) : "—"}</span>
        </div>`;
      });
      tooltip.innerHTML = html;
      tooltip.style.opacity = 1;

      const rect = chartEl.getBoundingClientRect();
      const tx = event.clientX - rect.left + 12;
      const ty = event.clientY - rect.top  - 20;
      tooltip.style.left = `${tx}px`;
      tooltip.style.top  = `${ty}px`;
    }

    function hideTooltip() { tooltip.style.opacity = 0; }

    // ── Data layer — redrawn on every slider change ──────────────────────────
    function drawData(data) {
      const filtered = applyMins(data);
      isGrouped = dataIsGrouped(filtered);
      if (isGrouped) {
        categories = filtered[0] ? filtered[0].values.map(d => d.x) : [];
        groups     = filtered.map(gp => gp.group);
      } else {
        categories = filtered.map(d => d.x);
        groups = [null];
      }
      manyCategories = categories.length > 20;
      someCategories = categories.length > 6;

      g.selectAll("*").remove();
      svg.selectAll(".legend-swatch, .legend-text").remove();

      xOuter = d3.scaleBand().domain(categories).range([0, width]).padding(barPadding);
      xInner = isGrouped ? d3.scaleBand().domain(groups).range([0, xOuter.bandwidth()]).padding(0.05) : null;

      g.append("g").attr("class", "grid")
        .call(d3.axisLeft(yScale).tickSize(-width).tickFormat(""))
        .selectAll("line").attr("stroke", "#1e2235");

      xAxisG = g.append("g").attr("class", "axis")
        .attr("transform", `translate(0,${height})`)
        .call(d3.axisBottom(xOuter));
      xAxisG.selectAll("text")
        .attr("fill", "#64748b")
        .attr("font-size", manyCategories ? "10px" : "12px")
        .attr("text-anchor", someCategories ? "end" : "middle")
        .attr("transform", manyCategories ? "rotate(-90)" : someCategories ? "rotate(-45)" : null)
        .attr("dy", manyCategories ? "-0.4em" : someCategories ? "0.2em" : "1.2em")
        .attr("dx", someCategories ? "-0.5em" : null);
      xAxisG.selectAll("path, line").attr("stroke", "#2d3148");

      yAxisG = g.append("g").attr("class", "axis")
        .call(d3.axisLeft(yScale).ticks(6).tickFormat(window.WeaveControls.axisFormat(yScale, config.y_format, 6)));
      yAxisG.selectAll("text").attr("fill", "#64748b").attr("font-size", "12px");
      yAxisG.selectAll("path, line").attr("stroke", "#2d3148");

      try {
        const _axb = xAxisG.node().getBBox();
        xLabelEl.attr("y", margin.top + height + _axb.y + _axb.height + 20);
      } catch (_e) {}

      if (isGrouped) {
        filtered.forEach(grp => {
          const color = colorScale(grp.group);
          g.selectAll(`.bar-${CSS.escape(grp.group)}`)
            .data(grp.values)
            .join("rect")
            .attr("class", "bar")
            .attr("data-group", grp.group)
            .attr("x",      d => xOuter(d.x) + xInner(grp.group) + _barDx(xInner.bandwidth(), xInner.step()))
            .attr("y",      d => d.y !== null ? yScale(d.y) : height)
            .attr("width",  _barW(xInner.bandwidth(), xInner.step()))
            .attr("height", d => d.y !== null ? height - yScale(d.y) : 0)
            .attr("fill",   color)
            .attr("rx", 2)
            .on("mousemove", (event, d) => showTooltip(event, d.x, [{ name: groupLabel(grp.group), value: d.y, color }]))
            .on("mouseleave", hideTooltip)
            .on("click", function(event) {
              if (!editMode) return;
              event.stopPropagation();
              openColorPicker(d3.select(this).attr("fill"), grp.group, event);
            });
        });
      } else {
        g.selectAll(".bar")
          .data(filtered)
          .join("rect")
          .attr("class", "bar")
          .attr("data-x", d => d.x)
          .attr("x",      d => xOuter(d.x) + _barDx(xOuter.bandwidth(), xOuter.step()))
          .attr("y",      d => d.y !== null ? yScale(d.y) : height)
          .attr("width",  _barW(xOuter.bandwidth(), xOuter.step()))
          .attr("height", d => d.y !== null ? height - yScale(d.y) : 0)
          .attr("fill",   d => resolveColor(d.x, _flatCS ? _flatCS(d.x) : config.color))
          .attr("rx", 2)
          .on("mousemove", (event, d) => showTooltip(event, d.x, [{ name: "Value", value: d.y, color: resolveColor(d.x, _flatCS ? _flatCS(d.x) : config.color) }]))
          .on("mouseleave", hideTooltip)
          .on("click", function(event, d) {
            if (!editMode) return;
            event.stopPropagation();
            openColorPicker(d3.select(this).attr("fill"), "__x__" + d.x, event);
          });
      }

      if (allGroups.length) {
        const lx = margin.left + width + 20;
        const ly = margin.top;
        groups.forEach((grp, i) => {
          svg.append("rect")
            .attr("class", "legend-swatch").attr("data-group", grp)
            .attr("x", lx).attr("y", ly + i * 22)
            .attr("width", 10).attr("height", 10).attr("rx", 2)
            .attr("fill", colorScale(grp));
          svg.append("text")
            .attr("class", "legend-text")
            .attr("x", lx + 16).attr("y", ly + i * 22 + 9)
            .attr("fill", "#94a3b8").attr("font-size", "12px")
            .text(groupLabel(grp));
        });
      }

      if (typeof applyTheme === "function") applyTheme(isLightBg(svgBg));
    }

    drawData(currentData);
    if (window.WeaveControls) window.WeaveControls.mount(controls, chartEl, {
      onScrub: v => { currentData = (slices[v] || []); drawData(currentData); },
      onMin:  (col, v) => { minState[col] = v; drawData(currentData); },
    });

    // --- SVG export ---
    const SVG_PROPS = [
      "fill", "stroke", "stroke-width", "stroke-dasharray", "stroke-linecap",
      "stroke-opacity", "fill-opacity", "opacity", "font-size", "font-family",
      "font-weight", "text-anchor", "dominant-baseline",
    ];

    function toHex(color) {
      if (!color || color === "none" || color.startsWith("#") || color.startsWith("url(")) return color;
      const m = color.match(/\d+/g);
      if (!m || m.length < 3) return color;
      return "#" + m.slice(0, 3).map(v => parseInt(v).toString(16).padStart(2, "0")).join("");
    }

    function buildExportSVG() {
      const svgEl = document.querySelector("svg");
      const clone = svgEl.cloneNode(true);
      clone.setAttribute("xmlns", "http://www.w3.org/2000/svg");
      clone.setAttribute("width", totalWidth);
      clone.setAttribute("height", totalHeight);

      const srcEls = [...svgEl.querySelectorAll("*")];
      const dstEls = [...clone.querySelectorAll("*")];

      srcEls.forEach((el, i) => {
        const dst     = dstEls[i];
        const computed = window.getComputedStyle(el);
        SVG_PROPS.forEach(prop => {
          const raw = el.getAttribute(prop) || computed.getPropertyValue(prop);
          const val = toHex(raw);
          if (val) dst.setAttribute(prop, val);
        });
        const fill = dst.getAttribute("fill") || "";
        if (fill.startsWith("url(")) dst.setAttribute("fill", "none");
      });

      const bg = document.createElementNS("http://www.w3.org/2000/svg", "rect");
      bg.setAttribute("width", "100%");
      bg.setAttribute("height", "100%");
      bg.setAttribute("fill", svgBg);
      clone.insertBefore(bg, clone.firstChild);

      return new XMLSerializer().serializeToString(clone);
    }

    async function copySVG() {
      const svgStr = buildExportSVG();
      const btn = document.getElementById("btn-copy");
      let ok = false;

      // Clipboard API silently fails on file:// (not a secure context) — skip it
      if (location.protocol !== "file:") {
        try {
          const blob = new Blob([svgStr], { type: "image/svg+xml" });
          await navigator.clipboard.write([new ClipboardItem({ "image/svg+xml": blob })]);
          ok = true;
        } catch {}

        if (!ok) {
          try { await navigator.clipboard.writeText(svgStr); ok = true; } catch {}
        }
      }

      if (!ok) {
        try {
          const ta = Object.assign(document.createElement("textarea"), { value: svgStr });
          ta.style.cssText = "position:fixed;top:0;left:0;opacity:0;pointer-events:none";
          document.body.appendChild(ta);
          ta.focus();
          ta.select();
          ok = document.execCommand("copy");
          document.body.removeChild(ta);
        } catch {}
      }

      btn.textContent = ok ? "Copied!" : "Failed";
      if (ok) btn.classList.add("success");
      setTimeout(() => { btn.textContent = "Copy SVG"; btn.classList.remove("success"); }, 1500);
    }

    function downloadSVG() {
      const svgStr = buildExportSVG();
      const blob = new Blob([svgStr], { type: "image/svg+xml" });
      const url  = URL.createObjectURL(blob);
      const a    = document.createElement("a");
      a.href = url; a.download = "chart.svg"; a.click();
      URL.revokeObjectURL(url);
    }

    document.getElementById("btn-copy").addEventListener("click", copySVG);
    document.getElementById("btn-download").addEventListener("click", downloadSVG);

    // --- Edit panel ---
    const editPanel = document.getElementById("edit-panel");
    const btnEdit   = document.getElementById("btn-edit");
    btnEdit.addEventListener("click", () => {
      editMode = !editMode;
      editPanel.classList.toggle("open", editMode);
      btnEdit.classList.toggle("active", editMode);
      btnEdit.textContent = editMode ? "Save" : "Edit";
      g.selectAll(".bar").style("cursor", editMode ? "pointer" : "default");
      if (!editMode) clearHighlight();
    });

    // SVG background picker + auto-contrast
    function isLightBg(hex) {
      const r = parseInt(hex.slice(1,3), 16);
      const g = parseInt(hex.slice(3,5), 16);
      const b = parseInt(hex.slice(5,7), 16);
      return (0.299*r + 0.587*g + 0.114*b) / 255 > 0.5;
    }

    function applyTheme(light) {
      const titleColor  = light ? "#1e293b" : "#e2e8f0";
      const labelColor  = light ? "#475569" : "#64748b";
      const axisColor   = light ? "#cbd5e1" : "#2d3148";
      const gridColor   = light ? "#d1d5db" : "#1e2235";
      const legendColor = light ? "#334155" : "#94a3b8";
      titleEl.attr("fill", titleColor);
      xLabelEl.attr("fill", labelColor);
      yLabelEl.attr("fill", labelColor);
      xAxisG.selectAll("text").attr("fill", labelColor);
      yAxisG.selectAll("text").attr("fill", labelColor);
      xAxisG.selectAll("path, line").attr("stroke", axisColor);
      yAxisG.selectAll("path, line").attr("stroke", axisColor);
      g.selectAll(".grid line").attr("stroke", gridColor);
      svg.selectAll(".legend-text").attr("fill", legendColor);
    }

    const pickBg = document.getElementById("pick-svg-bg");
    pickBg.value = toPickerHex(svgBg);
    pickBg.addEventListener("input", e => {
      svgBg = e.target.value;
      chartEl.style.background = svgBg;
      applyTheme(isLightBg(svgBg));
    });

    // Chart size
    const STEP = 150, MIN_SIZE = 400 + 64;
    function resize(delta) {
      chartEl.style.width = Math.max(MIN_SIZE, chartEl.offsetWidth + delta) + "px";
    }
    document.getElementById("ep-smaller").addEventListener("click", () => resize(-STEP));
    document.getElementById("ep-larger").addEventListener("click",  () => resize(+STEP));

    // Bar width
    const PAD_STEP = 0.08, PAD_MIN = 0.02, PAD_MAX = 0.85;
    function adjustPadding(delta) {
      barPadding = Math.min(PAD_MAX, Math.max(PAD_MIN, barPadding + delta));
      drawData(currentData);   // full redraw picks up the new padding
    }
    document.getElementById("ep-thinner")?.addEventListener("click", () => adjustPadding(+PAD_STEP));
    document.getElementById("ep-wider")?.addEventListener("click",   () => adjustPadding(-PAD_STEP));

    // Title / axis labels
    const editTitleEl  = document.getElementById("edit-title");
    const editXLabelEl = document.getElementById("edit-xlabel");
    const editYLabelEl = document.getElementById("edit-ylabel");
    editTitleEl.value  = config.title   || "";
    editXLabelEl.value = _xLabel;
    editYLabelEl.value = config.y_label || "";
    editTitleEl.addEventListener("input",  e => titleEl.text(e.target.value));
    editXLabelEl.addEventListener("input", e => xLabelEl.text(e.target.value));
    editYLabelEl.addEventListener("input", e => yLabelEl.text(e.target.value));
    requestAnimationFrame(() => {
      window.parent.postMessage({ type: "weave-height", height: document.body.scrollHeight }, "*");
    });
  </script>
</body>
</html>
