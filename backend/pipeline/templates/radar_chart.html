<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #0f1117;
      color: #e2e8f0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding-bottom: 16px;
    }

    #chart {
      position: relative;
      padding: 32px;
      background: #1a1d27;
      border-radius: 16px;
      box-shadow: 0 4px 32px rgba(0,0,0,0.4);
    }

    .chart-actions {
      position: absolute;
      top: 16px;
      right: 16px;
      display: flex;
      gap: 8px;
    }

    .chart-actions button {
      background: #252836;
      color: #94a3b8;
      border: 1px solid #2d3148;
      border-radius: 6px;
      padding: 6px 12px;
      font-size: 12px;
      cursor: pointer;
      transition: background 0.15s, color 0.15s;
    }

    .chart-actions button:hover { background: #2d3148; color: #e2e8f0; }
    .chart-actions button.success { color: #4ade80; border-color: #4ade80; }
    .chart-actions button.active  { color: #e2e8f0; background: #2d3148; }

    #edit-panel {
      display: none;
      position: absolute;
      top: 52px;
      right: 16px;
      background: #252836;
      border: 1px solid #2d3148;
      border-radius: 8px;
      padding: 12px 16px;
      flex-direction: column;
      gap: 10px;
      z-index: 10;
      min-width: 180px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.3);
    }
    #edit-panel.open { display: flex; }
    .edit-row { display: flex; align-items: center; justify-content: space-between; gap: 24px; }
    .edit-label { color: #94a3b8; font-size: 12px; white-space: nowrap; }
    .color-pick {
      width: 32px; height: 22px;
      padding: 1px 2px;
      background: #1a1d27;
      border: 1px solid #2d3148;
      border-radius: 4px;
      cursor: pointer;
    }
    .edit-divider { border-top: 1px solid #2d3148; margin: 2px 0; }
    .edit-btn-group { display: flex; gap: 4px; }
    .edit-btn {
      background: #1a1d27;
      color: #94a3b8;
      border: 1px solid #2d3148;
      border-radius: 4px;
      padding: 3px 10px;
      font-size: 13px;
      cursor: pointer;
    }
    .edit-btn:hover { background: #2d3148; color: #e2e8f0; }
    .edit-hint { color: #475569; font-size: 11px; font-style: italic; }
    .edit-text {
      background: #1a1d27;
      color: #e2e8f0;
      border: 1px solid #2d3148;
      border-radius: 4px;
      padding: 3px 8px;
      font-size: 12px;
      width: 110px;
      outline: none;
    }
    .edit-text:focus { border-color: #4f5680; }

    .radar-grid { fill: none; stroke: #1e2235; }
    .radar-spoke { stroke: #2d3148; }
    .radar-axis-label { fill: #94a3b8; font-size: 12px; }
    .radar-area { cursor: pointer; transition: opacity 0.1s; }
    .radar-dot { stroke: #1a1d27; stroke-width: 1; }

    .tooltip {
      position: absolute;
      background: #252836;
      border: 1px solid #2d3148;
      border-radius: 8px;
      padding: 10px 14px;
      font-size: 13px;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.1s;
      min-width: 150px;
    }

    .tooltip .tip-date  { color: #64748b; font-size: 11px; margin-bottom: 6px; }
    .tooltip .tip-row   { display: flex; align-items: center; gap: 6px; margin-top: 3px; }
    .tooltip .tip-swatch { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
    .tooltip .tip-label { color: #94a3b8; flex: 1; }
    .tooltip .tip-val   { color: #e2e8f0; font-weight: 600; }
  </style>
</head>
<body>
  <div id="chart">
    <div class="chart-actions">
      <button id="btn-edit">Edit</button>
      <button id="btn-copy">Copy SVG</button>
      <button id="btn-download">Download SVG</button>
    </div>
    <div id="edit-panel">
      <div class="edit-row">
        <span class="edit-label">SVG Background</span>
        <input type="color" class="color-pick" id="pick-svg-bg">
      </div>
      <div class="edit-divider"></div>
      <div class="edit-row">
        <span class="edit-label">Chart Size</span>
        <div class="edit-btn-group">
          <button class="edit-btn" id="ep-smaller">−</button>
          <button class="edit-btn" id="ep-larger">+</button>
        </div>
      </div>
      <div class="edit-divider"></div>
      <div class="edit-row">
        <span class="edit-label">Title</span>
        <input type="text" class="edit-text" id="edit-title" placeholder="Chart title">
      </div>
      <div class="edit-divider"></div>
      <span class="edit-hint">Click any series to change its color</span>
    </div>
  </div>
  <input type="color" id="floating-color-pick" style="position:fixed;opacity:0;pointer-events:none;width:0;height:0;left:-200px;top:-200px">
  <div class="tooltip" id="tooltip"></div>

  <script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
  <script>
    const raw    = __DATA__;
    const config = __CONFIG__;
    window.__weaveConfig = config;

    const markScale = config.mark_scale || 1;   // multiplier for point/line size

    let svgBg   = config.svg_bg || "#1a1d27";
    let editMode = false;
    let activeSeries = null;   // "__single__" or group name

    // ── Color picker ──────────────────────────────────────────────────────────
    const floatingPick = document.getElementById("floating-color-pick");
    floatingPick.addEventListener("input", e => {
      const color = e.target.value;
      if (!activeSeries) return;
      const sel = `[data-series="${CSS.escape(activeSeries)}"]`;
      svg.selectAll(`.radar-area${sel}`).attr("fill", color).attr("stroke", color);
      svg.selectAll(`.radar-dot${sel}`).attr("fill", color);
      svg.selectAll(`.legend-swatch${sel}`).attr("fill", color);
    });

    function openColorPicker(currentColor, series, event) {
      activeSeries = series;
      floatingPick.value = toPickerHex(currentColor);
      floatingPick.style.left = event.clientX + "px";
      floatingPick.style.top  = event.clientY + "px";
      floatingPick.getBoundingClientRect();
      floatingPick.click();
    }

    function toPickerHex(color) {
      if (/^#[0-9a-f]{6}$/i.test(color)) return color;
      const tmp = Object.assign(document.createElement("div"), { style: `color:${color};position:fixed;opacity:0` });
      document.body.appendChild(tmp);
      const rgb = getComputedStyle(tmp).color;
      document.body.removeChild(tmp);
      const m = rgb.match(/\d+/g);
      return m ? "#" + m.slice(0,3).map(v => (+v).toString(16).padStart(2,"0")).join("") : "#6366f1";
    }

    const _prettify = s => String(s).replace(/_/g, " ").replace(/([a-z])([A-Z])/g, "$1 $2").trim().replace(/\b\w/g, c => c.toUpperCase());

    // ── Data shape ────────────────────────────────────────────────────────────
    // grouped: [{group, values:[{x,y}]}]  ·  flat: [{x,y}] (single polygon)
    const isGrouped = raw.length > 0 && "group" in raw[0] && "values" in raw[0];
    const series    = isGrouped ? raw.map(s => ({ name: String(s.group), values: s.values }))
                                : [{ name: "__single__", values: raw }];
    const axes      = (series[0].values || []).map(v => v.x);
    const N         = axes.length;

    // Per-axis max for normalisation (handles mixed units across metrics).
    const axisMax = axes.map((_, i) =>
      d3.max(series, s => (s.values[i] && s.values[i].y != null) ? s.values[i].y : 0) || 1);

    const palette   = config.palette || d3.range(20).map(i => d3.hcl(230 + i * 137.508, 68, 65).formatHex());
    const catColors = config.category_colors || {};
    function resolveColor(key, fallback) {
      if (!key || key === "__single__") return fallback;
      if (catColors[key]) return catColors[key];
      const kl = key.toLowerCase();
      for (const [ck, cv] of Object.entries(catColors)) {
        if (kl.includes(ck.toLowerCase()) || ck.toLowerCase().includes(kl)) return cv;
      }
      return fallback;
    }
    const _groupCS = d3.scaleOrdinal(palette).domain(series.map(s => s.name));
    const seriesColor = s => isGrouped ? resolveColor(s.name, _groupCS(s.name)) : config.color;

    // ── Dimensions ────────────────────────────────────────────────────────────
    const legendWidth = isGrouped ? 130 : 0;
    const margin = { top: 40, right: 24 + legendWidth, bottom: 24, left: 24 };
    const totalWidth  = config.width;
    const totalHeight = config.height;
    const plotW = totalWidth  - margin.left - margin.right;
    const plotH = totalHeight - margin.top  - margin.bottom;
    const R  = Math.max(20, Math.min(plotW, plotH) / 2 - 56);   // radius, leaving room for labels
    const cx = margin.left + plotW / 2;
    const cy = margin.top  + plotH / 2;

    const chartEl = document.getElementById("chart");
    chartEl.style.width = (totalWidth + 64) + "px";

    const svg = d3.select("#chart")
      .append("svg")
      .attr("viewBox", `0 0 ${totalWidth} ${totalHeight}`)
      .attr("width", totalWidth)
      .attr("height", totalHeight);

    const angleOf = i => -Math.PI / 2 + i * (2 * Math.PI / N);
    // point on axis i at normalised radius t (0..1)
    const px = (i, t) => cx + R * t * Math.cos(angleOf(i));
    const py = (i, t) => cy + R * t * Math.sin(angleOf(i));

    // ── Grid rings + spokes ─────────────────────────────────────────────────────
    const levels = [0.25, 0.5, 0.75, 1.0];
    levels.forEach(lvl => {
      const pts = axes.map((_, i) => `${px(i, lvl)},${py(i, lvl)}`).join(" ");
      svg.append("polygon").attr("class", "radar-grid").attr("points", pts);
    });
    axes.forEach((_, i) => {
      svg.append("line").attr("class", "radar-spoke")
        .attr("x1", cx).attr("y1", cy)
        .attr("x2", px(i, 1)).attr("y2", py(i, 1));
    });

    // ── Axis labels ─────────────────────────────────────────────────────────────
    axes.forEach((ax, i) => {
      const lx = px(i, 1.14), ly = py(i, 1.14);
      const c = Math.cos(angleOf(i));
      const anchor = Math.abs(c) < 0.3 ? "middle" : (c > 0 ? "start" : "end");
      svg.append("text").attr("class", "radar-axis-label")
        .attr("x", lx).attr("y", ly)
        .attr("text-anchor", anchor)
        .attr("dominant-baseline", "middle")
        .text(_prettify(ax));
    });

    // ── Title ───────────────────────────────────────────────────────────────────
    const titleEl = svg.append("text")
      .attr("x", (totalWidth - legendWidth) / 2).attr("y", 18)
      .attr("text-anchor", "middle")
      .attr("fill", "#e2e8f0").attr("font-size", "14px").attr("font-weight", "600")
      .text(config.title || "");

    // ── Tooltip ───────────────────────────────────────────────────────────────
    const tooltip = document.getElementById("tooltip");
    const fmt = d3.format(",.2f");

    function positionTooltip(event) {
      const rect = chartEl.getBoundingClientRect();
      const mx = event.clientX - rect.left, my = event.clientY - rect.top;
      const tw = tooltip.offsetWidth || 170, th = tooltip.offsetHeight || 120;
      let tx = mx + 16; if (tx + tw > chartEl.offsetWidth - 4) tx = mx - tw - 16; if (tx < 4) tx = 4;
      let ty = my + 16; if (ty + th > chartEl.offsetHeight - 4) ty = my - th - 16; if (ty < 4) ty = 4;
      tooltip.style.left = `${tx}px`;
      tooltip.style.top  = `${ty}px`;
    }

    // Per-axis: every series' value on one axis (so overlapping polygons are all
    // readable regardless of which one sits on top).
    function showAxisTooltip(event, i) {
      let html = `<div class="tip-date">${_prettify(axes[i])}</div>`;
      series.forEach(s => {
        const v = s.values[i];
        html += `<div class="tip-row">
          <span class="tip-swatch" style="background:${seriesColor(s)}"></span>
          <span class="tip-label">${s.name === "__single__" ? "Value" : s.name}</span>
          <span class="tip-val">${v && v.y != null ? fmt(v.y) : "—"}</span></div>`;
      });
      tooltip.innerHTML = html;
      tooltip.style.opacity = 1;
      positionTooltip(event);
    }

    // Per-series: the full profile of one series across all axes.
    function showSeriesTooltip(event, s) {
      let html = `<div class="tip-date">${s.name === "__single__" ? "Value" : s.name}</div>`;
      s.values.forEach(v => {
        html += `<div class="tip-row">
          <span class="tip-label">${_prettify(v.x)}</span>
          <span class="tip-val">${v.y != null ? fmt(v.y) : "—"}</span></div>`;
      });
      tooltip.innerHTML = html;
      tooltip.style.opacity = 1;
      positionTooltip(event);
    }
    function hideTooltip() { tooltip.style.opacity = 0; }

    // ── Polygons ─────────────────────────────────────────────────────────────────
    const vertices = [];   // {x, y, i} for the on-top hover targets
    series.forEach(s => {
      const color = seriesColor(s);
      const pts = s.values.map((v, i) => {
        const t = axisMax[i] > 0 && v.y != null ? v.y / axisMax[i] : 0;
        return [px(i, t), py(i, t)];
      });

      svg.append("polygon")
        .attr("class", "radar-area")
        .attr("data-series", s.name)
        .attr("points", pts.map(p => p.join(",")).join(" "))
        .attr("fill", color)
        .attr("fill-opacity", isGrouped ? 0.22 : 0.3)
        .attr("stroke", color)
        .attr("stroke-width", 2 * markScale)
        .attr("stroke-linejoin", "round")
        .on("mousemove", event => showSeriesTooltip(event, s))
        .on("mouseleave", hideTooltip)
        .on("click", function(event) {
          if (!editMode) return;
          event.stopPropagation();
          openColorPicker(d3.select(this).attr("stroke"), s.name, event);
        });

      pts.forEach((p, i) => {
        svg.append("circle")
          .attr("class", "radar-dot")
          .attr("data-series", s.name)
          .attr("cx", p[0]).attr("cy", p[1])
          .attr("r", 3 * markScale)
          .attr("fill", color)
          .style("pointer-events", "none");
        vertices.push({ x: p[0], y: p[1], i });
      });
    });

    // On-top transparent hit targets at every vertex: hovering near any axis
    // vertex shows all series' values for that axis (readable even when polygons
    // overlap). Drawn last so they sit above the fills.
    vertices.forEach(vtx => {
      svg.append("circle")
        .attr("cx", vtx.x).attr("cy", vtx.y).attr("r", 11)
        .attr("fill", "transparent")
        .style("cursor", "default")
        .on("mousemove", event => showAxisTooltip(event, vtx.i))
        .on("mouseleave", hideTooltip);
    });

    // ── Legend (grouped only) ───────────────────────────────────────────────────
    if (isGrouped) {
      const lx = margin.left + plotW + 20;
      const ly = margin.top;
      series.forEach((s, i) => {
        svg.append("rect")
          .attr("class", "legend-swatch").attr("data-series", s.name)
          .attr("x", lx).attr("y", ly + i * 22)
          .attr("width", 10).attr("height", 10).attr("rx", 2)
          .attr("fill", seriesColor(s));
        svg.append("text")
          .attr("class", "legend-text")
          .attr("x", lx + 16).attr("y", ly + i * 22 + 9)
          .attr("fill", "#94a3b8").attr("font-size", "12px")
          .text(s.name);
      });
    }

    // ── SVG export ──────────────────────────────────────────────────────────────
    const SVG_PROPS = [
      "fill", "stroke", "stroke-width", "stroke-dasharray", "stroke-linecap",
      "stroke-linejoin", "stroke-opacity", "fill-opacity", "opacity", "font-size",
      "font-family", "font-weight", "text-anchor", "dominant-baseline",
    ];
    function toHex(color) {
      if (!color || color === "none" || color.startsWith("#") || color.startsWith("url(")) return color;
      const m = color.match(/\d+/g);
      if (!m || m.length < 3) return color;
      return "#" + m.slice(0, 3).map(v => parseInt(v).toString(16).padStart(2, "0")).join("");
    }
    function buildExportSVG() {
      const svgEl = document.querySelector("svg");
      const clone = svgEl.cloneNode(true);
      clone.setAttribute("xmlns", "http://www.w3.org/2000/svg");
      clone.setAttribute("width", totalWidth);
      clone.setAttribute("height", totalHeight);
      const srcEls = [...svgEl.querySelectorAll("*")];
      const dstEls = [...clone.querySelectorAll("*")];
      srcEls.forEach((el, i) => {
        const dst = dstEls[i];
        const computed = window.getComputedStyle(el);
        SVG_PROPS.forEach(prop => {
          const rawv = el.getAttribute(prop) || computed.getPropertyValue(prop);
          const val = toHex(rawv);
          if (val) dst.setAttribute(prop, val);
        });
        const fill = dst.getAttribute("fill") || "";
        if (fill.startsWith("url(")) dst.setAttribute("fill", "none");
      });
      const bg = document.createElementNS("http://www.w3.org/2000/svg", "rect");
      bg.setAttribute("width", "100%");
      bg.setAttribute("height", "100%");
      bg.setAttribute("fill", svgBg);
      clone.insertBefore(bg, clone.firstChild);
      return new XMLSerializer().serializeToString(clone);
    }
    async function copySVG() {
      const svgStr = buildExportSVG();
      const btn = document.getElementById("btn-copy");
      let ok = false;
      if (location.protocol !== "file:") {
        try {
          const blob = new Blob([svgStr], { type: "image/svg+xml" });
          await navigator.clipboard.write([new ClipboardItem({ "image/svg+xml": blob })]);
          ok = true;
        } catch {}
        if (!ok) { try { await navigator.clipboard.writeText(svgStr); ok = true; } catch {} }
      }
      if (!ok) {
        try {
          const ta = Object.assign(document.createElement("textarea"), { value: svgStr });
          ta.style.cssText = "position:fixed;top:0;left:0;opacity:0;pointer-events:none";
          document.body.appendChild(ta);
          ta.focus(); ta.select();
          ok = document.execCommand("copy");
          document.body.removeChild(ta);
        } catch {}
      }
      btn.textContent = ok ? "Copied!" : "Failed";
      if (ok) btn.classList.add("success");
      setTimeout(() => { btn.textContent = "Copy SVG"; btn.classList.remove("success"); }, 1500);
    }
    function downloadSVG() {
      const svgStr = buildExportSVG();
      const blob = new Blob([svgStr], { type: "image/svg+xml" });
      const url  = URL.createObjectURL(blob);
      const a    = document.createElement("a");
      a.href = url; a.download = "chart.svg"; a.click();
      URL.revokeObjectURL(url);
    }
    document.getElementById("btn-copy").addEventListener("click", copySVG);
    document.getElementById("btn-download").addEventListener("click", downloadSVG);

    // ── Edit panel ────────────────────────────────────────────────────────────
    const editPanel = document.getElementById("edit-panel");
    const btnEdit   = document.getElementById("btn-edit");
    btnEdit.addEventListener("click", () => {
      editMode = !editMode;
      editPanel.classList.toggle("open", editMode);
      btnEdit.classList.toggle("active", editMode);
      btnEdit.textContent = editMode ? "Save" : "Edit";
      svg.selectAll(".radar-area").style("cursor", editMode ? "pointer" : "default");
    });

    function isLightBg(hex) {
      const r = parseInt(hex.slice(1,3), 16);
      const g = parseInt(hex.slice(3,5), 16);
      const b = parseInt(hex.slice(5,7), 16);
      return (0.299*r + 0.587*g + 0.114*b) / 255 > 0.5;
    }
    function applyTheme(light) {
      const titleColor  = light ? "#1e293b" : "#e2e8f0";
      const labelColor  = light ? "#475569" : "#94a3b8";
      const gridColor   = light ? "#e2e8f0" : "#1e2235";
      const spokeColor  = light ? "#cbd5e1" : "#2d3148";
      const legendColor = light ? "#334155" : "#94a3b8";
      titleEl.attr("fill", titleColor);
      svg.selectAll(".radar-axis-label").attr("fill", labelColor);
      svg.selectAll(".radar-grid").attr("stroke", gridColor);
      svg.selectAll(".radar-spoke").attr("stroke", spokeColor);
      svg.selectAll(".legend-text").attr("fill", legendColor);
    }

    const pickBg = document.getElementById("pick-svg-bg");
    pickBg.value = toPickerHex(svgBg);
    pickBg.addEventListener("input", e => {
      svgBg = e.target.value;
      chartEl.style.background = svgBg;
      applyTheme(isLightBg(svgBg));
    });

    const STEP = 150, MIN_SIZE = 400 + 64;
    function resize(delta) {
      chartEl.style.width = Math.max(MIN_SIZE, chartEl.offsetWidth + delta) + "px";
    }
    document.getElementById("ep-smaller").addEventListener("click", () => resize(-STEP));
    document.getElementById("ep-larger").addEventListener("click",  () => resize(+STEP));

    const editTitleEl = document.getElementById("edit-title");
    editTitleEl.value = config.title || "";
    editTitleEl.addEventListener("input", e => titleEl.text(e.target.value));

    requestAnimationFrame(() => {
      window.parent.postMessage({ type: "weave-height", height: document.body.scrollHeight }, "*");
    });
  </script>
</body>
</html>
