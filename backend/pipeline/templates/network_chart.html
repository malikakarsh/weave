<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #0f1117;
      color: #e2e8f0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding-bottom: 16px;
    }

    #chart {
      position: relative;
      padding: 32px;
      background: #1a1d27;
      border-radius: 16px;
      box-shadow: 0 4px 32px rgba(0,0,0,0.4);
    }

    .chart-actions {
      position: absolute;
      top: 16px;
      right: 16px;
      display: flex;
      gap: 8px;
      z-index: 10;
    }

    .chart-actions button {
      background: #252836;
      color: #94a3b8;
      border: 1px solid #2d3148;
      border-radius: 6px;
      padding: 6px 12px;
      font-size: 12px;
      cursor: pointer;
      transition: background 0.15s, color 0.15s;
    }
    .chart-actions button:hover { background: #2d3148; color: #e2e8f0; }
    .chart-actions button.success { color: #4ade80; border-color: #4ade80; }
    .chart-actions button.active  { color: #e2e8f0; background: #2d3148; }

    #edit-panel {
      display: none;
      position: absolute;
      top: 52px;
      right: 16px;
      background: #252836;
      border: 1px solid #2d3148;
      border-radius: 8px;
      padding: 12px 16px;
      flex-direction: column;
      gap: 10px;
      z-index: 10;
      min-width: 200px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.3);
    }
    #edit-panel.open { display: flex; }
    .edit-row { display: flex; align-items: center; justify-content: space-between; gap: 24px; }
    .edit-label { color: #94a3b8; font-size: 12px; white-space: nowrap; }
    .color-pick {
      width: 32px; height: 22px;
      padding: 1px 2px;
      background: #1a1d27;
      border: 1px solid #2d3148;
      border-radius: 4px;
      cursor: pointer;
    }
    .edit-divider { border-top: 1px solid #2d3148; margin: 2px 0; }
    .edit-btn-group { display: flex; gap: 4px; }
    .edit-btn {
      background: #1a1d27;
      color: #94a3b8;
      border: 1px solid #2d3148;
      border-radius: 4px;
      padding: 3px 10px;
      font-size: 13px;
      cursor: pointer;
    }
    .edit-btn:hover { background: #2d3148; color: #e2e8f0; }
    .edit-text {
      background: #1a1d27;
      color: #e2e8f0;
      border: 1px solid #2d3148;
      border-radius: 4px;
      padding: 3px 8px;
      font-size: 12px;
      width: 120px;
      outline: none;
    }
    .edit-text:focus { border-color: #4f5680; }

    .hint {
      position: absolute;
      bottom: 12px;
      left: 50%;
      transform: translateX(-50%);
      color: #334155;
      font-size: 11px;
      pointer-events: none;
    }

    .tooltip {
      position: absolute;
      background: #252836;
      border: 1px solid #2d3148;
      border-radius: 8px;
      padding: 10px 14px;
      font-size: 13px;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.1s;
      min-width: 140px;
      z-index: 20;
    }
    .tooltip .tip-name  { color: #e2e8f0; font-weight: 600; margin-bottom: 4px; }
    .tooltip .tip-row   { display: flex; justify-content: space-between; gap: 16px; margin-top: 3px; }
    .tooltip .tip-label { color: #94a3b8; }
    .tooltip .tip-val   { color: #e2e8f0; }
  </style>
</head>
<body>
  <div id="chart">
    <div class="chart-actions">
      <button id="btn-edit">Edit</button>
      <button id="btn-copy">Copy SVG</button>
      <button id="btn-download">Download SVG</button>
    </div>
    <div id="edit-panel">
      <div class="edit-row">
        <span class="edit-label">SVG Background</span>
        <input type="color" class="color-pick" id="pick-svg-bg">
      </div>
      <div class="edit-row">
        <span class="edit-label">Node Color</span>
        <input type="color" class="color-pick" id="pick-node-color">
      </div>
      <div class="edit-divider"></div>
      <div class="edit-row">
        <span class="edit-label">Chart Size</span>
        <div class="edit-btn-group">
          <button class="edit-btn" id="ep-smaller">−</button>
          <button class="edit-btn" id="ep-larger">+</button>
        </div>
      </div>
      <div class="edit-divider"></div>
      <div class="edit-row">
        <span class="edit-label">Title</span>
        <input type="text" class="edit-text" id="edit-title" placeholder="Chart title">
      </div>
    </div>
    <span class="hint">Drag nodes · Scroll to zoom · Click node to recolor</span>
  </div>
  <input type="color" id="floating-color-pick" style="position:fixed;opacity:0;pointer-events:none;width:0;height:0;left:-200px;top:-200px">
  <div class="tooltip" id="tooltip"></div>

  <script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
  <script>
    const raw    = __DATA__;
    const config = __CONFIG__;
    window.__weaveConfig = config;

    let svgBg     = config.svg_bg || "#1a1d27";
    let nodeColor = config.color  || "#6366f1";
    const nodeColors = {}; // per-node color overrides
    let activeNodeId  = null;

    const floatingPick = document.getElementById("floating-color-pick");
    floatingPick.addEventListener("input", e => {
      if (!activeNodeId) return;
      nodeColors[activeNodeId] = e.target.value;
      nodeG.select(`circle[data-id="${CSS.escape(activeNodeId)}"]`).attr("fill", e.target.value);
    });

    // ── Data prep ─────────────────────────────────────────────────────────────
    const nodes = raw.nodes.map(d => ({ ...d }));
    const links = raw.links.map(d => ({ ...d }));

    const hasWeight = links.length > 0 &&
      links[0].weight !== null && links[0].weight !== undefined;

    // Compute degree per node
    const degreeMap = {};
    links.forEach(l => {
      const s = typeof l.source === "object" ? l.source.id : l.source;
      const t = typeof l.target === "object" ? l.target.id : l.target;
      degreeMap[s] = (degreeMap[s] || 0) + 1;
      degreeMap[t] = (degreeMap[t] || 0) + 1;
    });
    nodes.forEach(n => { n.degree = degreeMap[n.id] || 0; });

    const hasNodeSize = nodes.length > 0 && "size" in nodes[0];
    const maxDeg      = d3.max(nodes, n => n.degree) || 1;
    const maxSize     = hasNodeSize ? (d3.max(nodes, n => n.size) || 1) : null;
    const nodeR       = hasNodeSize
      ? d3.scaleSqrt().domain([0, maxSize]).range([5, 22])
      : d3.scaleSqrt().domain([0, maxDeg]).range([5, 18]);
    const getR        = d => hasNodeSize ? nodeR(d.size || 0) : nodeR(d.degree);

    const maxWeight = hasWeight ? (d3.max(links, l => Math.abs(l.weight || 0)) || 1) : 1;
    const linkW     = hasWeight
      ? d3.scaleLinear().domain([0, maxWeight]).range([1, 5])
      : () => 1.5;

    // ── Dimensions ────────────────────────────────────────────────────────────
    const totalWidth  = config.width;
    const totalHeight = config.height;

    const chartEl = document.getElementById("chart");
    chartEl.style.width = (totalWidth + 64) + "px";

    const svg = d3.select("#chart")
      .append("svg")
      .attr("viewBox", `0 0 ${totalWidth} ${totalHeight}`)
      .attr("width", totalWidth)
      .attr("height", totalHeight);
      .style("cursor", "grab");

    // ── Title ─────────────────────────────────────────────────────────────────
    const titleEl = svg.append("text")
      .attr("x", totalWidth / 2).attr("y", 22)
      .attr("text-anchor", "middle")
      .attr("fill", "#e2e8f0").attr("font-size", "14px").attr("font-weight", "600")
      .text(config.title || "");

    // ── Zoom layer ────────────────────────────────────────────────────────────
    const zoomG = svg.append("g");
    svg.call(d3.zoom()
      .scaleExtent([0.15, 8])
      .on("zoom", e => {
        zoomG.attr("transform", e.transform);
        svg.style("cursor", e.sourceEvent ? "grabbing" : "grab");
      })
      .on("end", () => svg.style("cursor", "grab")));

    // ── Link layer ────────────────────────────────────────────────────────────
    const linkG = zoomG.append("g").attr("class", "links");
    const linkSel = linkG.selectAll("line")
      .data(links)
      .join("line")
      .attr("stroke", "#2d3148")
      .attr("stroke-width", d => linkW(d.weight || 0))
      .attr("stroke-opacity", 0.7);

    // ── Node layer ────────────────────────────────────────────────────────────
    const nodeG = zoomG.append("g").attr("class", "nodes");

    let chargeStrength = -220;

    const simulation = d3.forceSimulation(nodes)
      .force("link",      d3.forceLink(links).id(d => d.id).distance(90))
      .force("charge",    d3.forceManyBody().strength(chargeStrength))
      .force("center",    d3.forceCenter(totalWidth / 2, totalHeight / 2))
      .force("collision", d3.forceCollide(d => getR(d) + 4))
      .on("tick", ticked);

    function ticked() {
      linkSel
        .attr("x1", d => d.source.x).attr("y1", d => d.source.y)
        .attr("x2", d => d.target.x).attr("y2", d => d.target.y);
      nodeSel.attr("cx", d => d.x).attr("cy", d => d.y);
      labelSel.attr("x", d => d.x).attr("y", d => d.y + getR(d) + 11);
    }

    const tooltip = document.getElementById("tooltip");

    function neighborSet(d) {
      const ids = new Set();
      links.forEach(l => {
        const s = typeof l.source === "object" ? l.source.id : l.source;
        const t = typeof l.target === "object" ? l.target.id : l.target;
        if (s === d.id) ids.add(t);
        if (t === d.id) ids.add(s);
      });
      return ids;
    }

    function showTooltip(event, d) {
      const connections = links.filter(l => {
        const s = typeof l.source === "object" ? l.source.id : l.source;
        const t = typeof l.target === "object" ? l.target.id : l.target;
        return s === d.id || t === d.id;
      });
      let html = `<div class="tip-name">${d.id}</div>
        <div class="tip-row"><span class="tip-label">Connections</span><span class="tip-val">${d.degree}</span></div>`;
      if (hasNodeSize) {
        html += `<div class="tip-row"><span class="tip-label">Total weight</span><span class="tip-val">${d3.format(",.0f")(d.size || 0)}</span></div>`;
      } else if (hasWeight && connections.length) {
        const totalW = d3.sum(connections, l => l.weight || 0);
        html += `<div class="tip-row"><span class="tip-label">Total weight</span><span class="tip-val">${d3.format(",.0f")(totalW)}</span></div>`;
      }
      tooltip.innerHTML = html;
      tooltip.style.opacity = 1;
      const rect = chartEl.getBoundingClientRect();
      tooltip.style.left = `${event.clientX - rect.left + 14}px`;
      tooltip.style.top  = `${event.clientY - rect.top  - 20}px`;
    }

    function hideTooltip() { tooltip.style.opacity = 0; }

    const nodeSel = nodeG.selectAll("circle")
      .data(nodes)
      .join("circle")
      .attr("r",           d => getR(d))
      .attr("fill",        nodeColor)
      .attr("stroke",      "#1a1d27")
      .attr("stroke-width", 2)
      .attr("data-id",     d => d.id)
      .style("cursor", "pointer")
      .on("mousemove", (event, d) => {
        showTooltip(event, d);
        // Dim non-neighbors
        const nbrs = neighborSet(d);
        nodeSel.attr("opacity", n => n.id === d.id || nbrs.has(n.id) ? 1 : 0.15);
        labelSel.attr("opacity", n => n.id === d.id || nbrs.has(n.id) ? 1 : 0.15);
        linkSel.attr("stroke-opacity", l => {
          const s = typeof l.source === "object" ? l.source.id : l.source;
          const t = typeof l.target === "object" ? l.target.id : l.target;
          return s === d.id || t === d.id ? 1 : 0.08;
        });
      })
      .on("mouseleave", () => {
        hideTooltip();
        nodeSel.attr("opacity", 1);
        labelSel.attr("opacity", 1);
        linkSel.attr("stroke-opacity", 0.7);
      })
      .on("click", function(event, d) {
        if (!editMode) return;
        event.stopPropagation();
        activeNodeId = d.id;
        const currentColor = nodeColors[d.id] || nodeColor;
        floatingPick.value = toPickerHex(currentColor);
        floatingPick.style.left = event.clientX + "px";
        floatingPick.style.top  = event.clientY + "px";
        floatingPick.getBoundingClientRect();
        floatingPick.click();
      })
      .call(d3.drag()
        .on("start", (event, d) => {
          if (!event.active) simulation.alphaTarget(0.3).restart();
          d.fx = d.x; d.fy = d.y;
        })
        .on("drag",  (event, d) => { d.fx = event.x; d.fy = event.y; })
        .on("end",   (event, d) => {
          if (!event.active) simulation.alphaTarget(0);
          d.fx = null; d.fy = null;
        }));

    // ── Label layer ───────────────────────────────────────────────────────────
    const labelSel = zoomG.append("g").attr("class", "labels")
      .selectAll("text")
      .data(nodes)
      .join("text")
      .attr("text-anchor", "middle")
      .attr("font-size", "10px")
      .attr("fill", "#94a3b8")
      .attr("pointer-events", "none")
      .text(d => d.id);

    // ── SVG export ────────────────────────────────────────────────────────────
    const SVG_PROPS = [
      "fill", "stroke", "stroke-width", "stroke-dasharray", "stroke-linecap",
      "stroke-opacity", "fill-opacity", "opacity", "font-size", "font-family",
      "font-weight", "text-anchor", "dominant-baseline", "cx", "cy", "r",
      "x1", "y1", "x2", "y2",
    ];

    function toHex(color) {
      if (!color || color === "none" || color.startsWith("#") || color.startsWith("url(")) return color;
      const m = color.match(/\d+/g);
      if (!m || m.length < 3) return color;
      return "#" + m.slice(0, 3).map(v => parseInt(v).toString(16).padStart(2, "0")).join("");
    }

    function buildExportSVG() {
      // Stop simulation so positions are stable
      simulation.stop();

      const svgEl = document.querySelector("svg");
      const clone = svgEl.cloneNode(true);
      clone.setAttribute("xmlns", "http://www.w3.org/2000/svg");
      clone.setAttribute("width", totalWidth);
      clone.setAttribute("height", totalHeight);

      const srcEls = [...svgEl.querySelectorAll("*")];
      const dstEls = [...clone.querySelectorAll("*")];
      srcEls.forEach((el, i) => {
        const dst     = dstEls[i];
        const computed = window.getComputedStyle(el);
        SVG_PROPS.forEach(prop => {
          const val = toHex(el.getAttribute(prop) || computed.getPropertyValue(prop));
          if (val) dst.setAttribute(prop, val);
        });
      });

      const bg = document.createElementNS("http://www.w3.org/2000/svg", "rect");
      bg.setAttribute("width", "100%"); bg.setAttribute("height", "100%");
      bg.setAttribute("fill", svgBg);
      clone.insertBefore(bg, clone.firstChild);

      return new XMLSerializer().serializeToString(clone);
    }

    async function copySVG() {
      const svgStr = buildExportSVG();
      const btn = document.getElementById("btn-copy");
      let ok = false;

      if (location.protocol !== "file:") {
        try {
          const blob = new Blob([svgStr], { type: "image/svg+xml" });
          await navigator.clipboard.write([new ClipboardItem({ "image/svg+xml": blob })]);
          ok = true;
        } catch {}
        if (!ok) {
          try { await navigator.clipboard.writeText(svgStr); ok = true; } catch {}
        }
      }

      if (!ok) {
        try {
          const ta = Object.assign(document.createElement("textarea"), { value: svgStr });
          ta.style.cssText = "position:fixed;top:0;left:0;opacity:0;pointer-events:none";
          document.body.appendChild(ta); ta.focus(); ta.select();
          ok = document.execCommand("copy");
          document.body.removeChild(ta);
        } catch {}
      }

      btn.textContent = ok ? "Copied!" : "Failed";
      if (ok) btn.classList.add("success");
      setTimeout(() => { btn.textContent = "Copy SVG"; btn.classList.remove("success"); }, 1500);
    }

    function downloadSVG() {
      const svgStr = buildExportSVG();
      const blob = new Blob([svgStr], { type: "image/svg+xml" });
      const url  = URL.createObjectURL(blob);
      Object.assign(document.createElement("a"), { href: url, download: "chart.svg" }).click();
      URL.revokeObjectURL(url);
    }

    document.getElementById("btn-copy").addEventListener("click", copySVG);
    document.getElementById("btn-download").addEventListener("click", downloadSVG);

    // ── Edit panel ────────────────────────────────────────────────────────────
    let editMode = false;
    const editPanel = document.getElementById("edit-panel");
    const btnEdit   = document.getElementById("btn-edit");

    btnEdit.addEventListener("click", () => {
      editMode = !editMode;
      editPanel.classList.toggle("open", editMode);
      btnEdit.classList.toggle("active", editMode);
      btnEdit.textContent = editMode ? "Save" : "Edit";
    });

    function toPickerHex(color) {
      if (/^#[0-9a-f]{6}$/i.test(color)) return color;
      const tmp = Object.assign(document.createElement("div"), { style: `color:${color};position:fixed;opacity:0` });
      document.body.appendChild(tmp);
      const rgb = getComputedStyle(tmp).color;
      document.body.removeChild(tmp);
      const m = rgb.match(/\d+/g);
      return m ? "#" + m.slice(0,3).map(v => (+v).toString(16).padStart(2,"0")).join("") : "#6366f1";
    }

    function isLightBg(hex) {
      const r = parseInt(hex.slice(1,3), 16);
      const g = parseInt(hex.slice(3,5), 16);
      const b = parseInt(hex.slice(5,7), 16);
      return (0.299*r + 0.587*g + 0.114*b) / 255 > 0.5;
    }

    function applyTheme(light) {
      const tc = light ? "#1e293b" : "#e2e8f0";
      const lc = light ? "#475569" : "#94a3b8";
      titleEl.attr("fill", tc);
      labelSel.attr("fill", lc);
      linkSel.attr("stroke", light ? "#cbd5e1" : "#2d3148");
    }

    const pickBg = document.getElementById("pick-svg-bg");
    pickBg.value = toPickerHex(svgBg);
    pickBg.addEventListener("input", e => {
      svgBg = e.target.value;
      chartEl.style.background = svgBg;
      applyTheme(isLightBg(svgBg));
    });

    const pickNode = document.getElementById("pick-node-color");
    pickNode.value = toPickerHex(nodeColor);
    pickNode.addEventListener("input", e => {
      nodeColor = e.target.value;
      Object.keys(nodeColors).forEach(k => delete nodeColors[k]);
      nodeSel.attr("fill", nodeColor);
    });

    // Chart size
    const STEP = 150, MIN_SIZE = 400 + 64;
    document.getElementById("ep-smaller").addEventListener("click", () => {
      chartEl.style.width = Math.max(MIN_SIZE, chartEl.offsetWidth - STEP) + "px";
    });
    document.getElementById("ep-larger").addEventListener("click", () => {
      chartEl.style.width = (chartEl.offsetWidth + STEP) + "px";
    });

    // Spread (charge strength)
    const CHARGE_STEP = 60, CHARGE_MIN = -800, CHARGE_MAX = -40;
    document.getElementById("ep-tighter").addEventListener("click", () => {
      chargeStrength = Math.max(CHARGE_MIN, chargeStrength - CHARGE_STEP);
      simulation.force("charge", d3.forceManyBody().strength(chargeStrength));
      simulation.alpha(0.3).restart();
    });
    document.getElementById("ep-looser").addEventListener("click", () => {
      chargeStrength = Math.min(CHARGE_MAX, chargeStrength + CHARGE_STEP);
      simulation.force("charge", d3.forceManyBody().strength(chargeStrength));
      simulation.alpha(0.3).restart();
    });

    // Title
    const editTitleEl = document.getElementById("edit-title");
    editTitleEl.value = config.title || "";
    requestAnimationFrame(() => {
      window.parent.postMessage({ type: "weave-height", height: document.body.scrollHeight }, "*");
    });
    editTitleEl.addEventListener("input", e => titleEl.text(e.target.value));
  </script>
</body>
</html>
