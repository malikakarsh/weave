<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #0f1117;
      color: #e2e8f0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    #chart {
      position: relative;
      padding: 32px;
      background: #1a1d27;
      border-radius: 16px;
      box-shadow: 0 4px 32px rgba(0,0,0,0.4);
    }

    .chart-actions {
      position: absolute;
      top: 16px;
      right: 16px;
      display: flex;
      gap: 8px;
    }

    .chart-actions button {
      background: #252836;
      color: #94a3b8;
      border: 1px solid #2d3148;
      border-radius: 6px;
      padding: 6px 12px;
      font-size: 12px;
      cursor: pointer;
      transition: background 0.15s, color 0.15s;
    }

    .chart-actions button:hover { background: #2d3148; color: #e2e8f0; }
    .chart-actions button.success { color: #4ade80; border-color: #4ade80; }
    .chart-actions button.active  { color: #e2e8f0; background: #2d3148; }

    #edit-panel {
      display: none;
      position: absolute;
      top: 52px;
      right: 16px;
      background: #252836;
      border: 1px solid #2d3148;
      border-radius: 8px;
      padding: 12px 16px;
      flex-direction: column;
      gap: 10px;
      z-index: 10;
      min-width: 180px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.3);
    }
    #edit-panel.open { display: flex; }
    .edit-row { display: flex; align-items: center; justify-content: space-between; gap: 24px; }
    .edit-label { color: #94a3b8; font-size: 12px; white-space: nowrap; }
    .color-pick {
      width: 32px; height: 22px;
      padding: 1px 2px;
      background: #1a1d27;
      border: 1px solid #2d3148;
      border-radius: 4px;
      cursor: pointer;
    }
    .edit-divider { border-top: 1px solid #2d3148; margin: 2px 0; }
    .edit-btn-group { display: flex; gap: 4px; }
    .edit-btn {
      background: #1a1d27;
      color: #94a3b8;
      border: 1px solid #2d3148;
      border-radius: 4px;
      padding: 3px 10px;
      font-size: 13px;
      cursor: pointer;
    }
    .edit-btn:hover { background: #2d3148; color: #e2e8f0; }
    .edit-text {
      background: #1a1d27;
      color: #e2e8f0;
      border: 1px solid #2d3148;
      border-radius: 4px;
      padding: 3px 8px;
      font-size: 12px;
      width: 110px;
      outline: none;
    }
    .edit-text:focus { border-color: #4f5680; }

    .sphere    { fill: #0d1929; }
    .graticule { fill: none; stroke: #162035; stroke-width: 0.4; }
    .country   { fill: #1e2d42; stroke: #0d1929; stroke-width: 0.5; }
    .sphere-border { fill: none; stroke: #1e2d42; stroke-width: 0.8; }
    .symbol { transition: opacity 0.15s; }
    .symbol:hover { opacity: 1 !important; }

    #loading {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #475569;
      font-size: 13px;
      pointer-events: none;
    }

    .tooltip {
      position: absolute;
      background: #252836;
      border: 1px solid #2d3148;
      border-radius: 8px;
      padding: 10px 14px;
      font-size: 13px;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.1s;
      min-width: 130px;
      z-index: 20;
    }
    .tooltip .tip-label { color: #e2e8f0; font-weight: 600; margin-bottom: 4px; }
    .tooltip .tip-row   { display: flex; align-items: center; gap: 6px; margin-top: 3px; }
    .tooltip .tip-swatch { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
    .tooltip .tip-key   { color: #94a3b8; flex: 1; }
    .tooltip .tip-val   { color: #e2e8f0; font-weight: 600; }
  </style>
</head>
<body>
  <div id="chart">
    <div id="loading">Loading map…</div>
    <div class="chart-actions">
      <button id="btn-edit">Edit</button>
      <button id="btn-copy">Copy SVG</button>
      <button id="btn-download">Download SVG</button>
    </div>
    <div id="edit-panel">
      <div class="edit-row">
        <span class="edit-label">SVG Background</span>
        <input type="color" class="color-pick" id="pick-svg-bg">
      </div>
      <div class="edit-divider"></div>
      <div class="edit-row">
        <span class="edit-label">Chart Size</span>
        <div class="edit-btn-group">
          <button class="edit-btn" id="ep-smaller">−</button>
          <button class="edit-btn" id="ep-larger">+</button>
        </div>
      </div>
      <div class="edit-divider"></div>
      <div class="edit-row">
        <span class="edit-label">Title</span>
        <input type="text" class="edit-text" id="edit-title" placeholder="Chart title">
      </div>
      <div class="edit-divider"></div>
      <div class="edit-row">
        <span class="edit-label">Land Color</span>
        <input type="color" class="color-pick" id="pick-land">
      </div>
      <div class="edit-row">
        <span class="edit-label">Ocean Color</span>
        <input type="color" class="color-pick" id="pick-ocean">
      </div>
      <div class="edit-divider"></div>
      <div class="edit-row" id="row-symbol-color">
        <span class="edit-label">Symbol Color</span>
        <input type="color" class="color-pick" id="pick-symbol">
      </div>
      <div class="edit-row">
        <span class="edit-label">Symbol Size</span>
        <div class="edit-btn-group">
          <button class="edit-btn" id="ep-sym-smaller">−</button>
          <button class="edit-btn" id="ep-sym-larger">+</button>
        </div>
      </div>
      <span class="edit-hint" id="edit-hint-group" style="display:none">Click any symbol to recolor its group</span>
    </div>
  </div>
  <input type="color" id="floating-color-pick" style="position:fixed;opacity:0;pointer-events:none;width:0;height:0;left:-200px;top:-200px">
  <div class="tooltip" id="tooltip"></div>

  <script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
  <script src="https://cdn.jsdelivr.net/npm/topojson-client@3/dist/topojson-client.min.js"></script>
  <script>
    const raw    = __DATA__;
    const config = __CONFIG__;

    let svgBg    = config.svg_bg || "#1a1d27";
    let editMode    = false;
    let symScale    = 1.0;
    let activeSeries = null;

    function toPickerHex(color) {
      if (/^#[0-9a-f]{6}$/i.test(color)) return color;
      const tmp = Object.assign(document.createElement("div"), { style: `color:${color};position:fixed;opacity:0` });
      document.body.appendChild(tmp);
      const rgb = getComputedStyle(tmp).color;
      document.body.removeChild(tmp);
      const m = rgb.match(/\d+/g);
      return m ? "#" + m.slice(0,3).map(v => (+v).toString(16).padStart(2,"0")).join("") : "#6366f1";
    }

    const hasGroup = raw.length > 0 && "group" in raw[0];
    const hasZ     = raw.length > 0 && "z" in raw[0];
    const hasLabel = raw.length > 0 && "label" in raw[0];

    const palette    = config.palette || d3.range(20).map(i => d3.hcl(230 + i * 137.508, 68, 65).formatHex());
    const groupNames = hasGroup ? [...new Set(raw.map(d => d.group))] : [];
    // When no group_column but label_column exists, color each symbol by its label
    const labelNames = (!hasGroup && hasLabel) ? [...new Set(raw.map(d => d.label))] : [];
    const colorScale = hasGroup
      ? d3.scaleOrdinal(palette).domain(groupNames)
      : (hasLabel ? d3.scaleOrdinal(palette).domain(labelNames) : null);

    const accentColor  = config.color || palette[0];
    const catColors    = config.category_colors || {};

    function resolveColor(key, fallback) {
      if (catColors[key]) return catColors[key];
      const kl = (key || "").toLowerCase();
      for (const [ck, cv] of Object.entries(catColors)) {
        if (kl.includes(ck.toLowerCase()) || ck.toLowerCase().includes(kl)) return cv;
      }
      return fallback;
    }

    const seriesColor  = {};
    if (hasGroup) groupNames.forEach(n => { seriesColor[n] = resolveColor(n, colorScale(n)); });
    if (!hasGroup && hasLabel) labelNames.forEach(n => { seriesColor[n] = resolveColor(n, colorScale(n)); });

    // ── Floating color picker (grouped mode) ──────────────────────────────────
    const floatingPick = document.getElementById("floating-color-pick");
    floatingPick.addEventListener("input", e => {
      if (!activeSeries) return;
      const color = e.target.value;
      seriesColor[activeSeries] = color;
      d3.selectAll(`.symbol[data-group="${CSS.escape(activeSeries)}"]`).style("fill", color);
      d3.selectAll(`.legend-dot[data-group="${CSS.escape(activeSeries)}"]`).attr("fill", color);
    });

    function openColorPicker(currentColor, group, event) {
      activeSeries = group;
      floatingPick.value = toPickerHex(currentColor);
      floatingPick.style.left = event.clientX + "px";
      floatingPick.style.top  = event.clientY + "px";
      floatingPick.getBoundingClientRect();
      floatingPick.click();
    }

    // ── Dimensions ────────────────────────────────────────────────────────────
    const legendWidth  = hasGroup ? 130 : (hasZ ? 110 : 0);
    const totalWidth   = config.width;
    const totalHeight  = config.height;
    const mapWidth     = totalWidth  - legendWidth;
    const mapHeight    = totalHeight;
    const titlePad     = config.title ? 28 : 0;

    const chartEl = document.getElementById("chart");
    chartEl.style.width = (totalWidth + 64) + "px";

    const svg = d3.select("#chart")
      .append("svg")
      .attr("viewBox", `0 0 ${totalWidth} ${totalHeight}`)
      .attr("width", "100%");

    const mapG = svg.append("g");

    // ── Title ─────────────────────────────────────────────────────────────────
    const titleEl = svg.append("text")
      .attr("x", mapWidth / 2).attr("y", 18)
      .attr("text-anchor", "middle")
      .attr("fill", "#e2e8f0").attr("font-size", "14px").attr("font-weight", "600")
      .text(config.title || "");

    // ── Size scale ────────────────────────────────────────────────────────────
    const zMax   = hasZ ? (d3.max(raw, d => d.z) || 1) : 1;
    const zMin   = hasZ ? (d3.min(raw, d => d.z) || 0) : 0;
    const rBase  = hasZ
      ? d3.scaleSqrt().domain([0, zMax]).range([2, 22])
      : () => 5;
    const getR   = d => (hasZ && d.z != null ? rBase(d.z) : 5) * symScale;

    // ── Tooltip ───────────────────────────────────────────────────────────────
    const tooltip  = document.getElementById("tooltip");
    const formatZ  = d3.format(",.0f");

    function showTip(event, d) {
      const color = hasGroup ? seriesColor[d.group] : accentColor;
      let html = "";
      if (d.label) html += `<div class="tip-label">${d.label}</div>`;
      if (hasGroup) {
        html += `<div class="tip-row">
          <span class="tip-swatch" style="background:${color}"></span>
          <span class="tip-key">${d.group}</span>
        </div>`;
      }
      if (hasZ && d.z != null) {
        html += `<div class="tip-row">
          <span class="tip-key">${config.z_label || config.y_label || "Value"}</span>
          <span class="tip-val">${formatZ(d.z)}</span>
        </div>`;
      }
      html += `<div class="tip-row">
        <span class="tip-key">lon</span>
        <span class="tip-val">${d.x.toFixed(2)}</span>
      </div>
      <div class="tip-row">
        <span class="tip-key">lat</span>
        <span class="tip-val">${d.y.toFixed(2)}</span>
      </div>`;
      tooltip.innerHTML = html;
      const rect = chartEl.getBoundingClientRect();
      tooltip.style.left    = `${event.clientX - rect.left + 14}px`;
      tooltip.style.top     = `${event.clientY - rect.top  - 20}px`;
      tooltip.style.opacity = 1;
    }

    // ── Load world atlas and draw ─────────────────────────────────────────────
    d3.json("https://cdn.jsdelivr.net/npm/world-atlas@2/countries-110m.json").then(world => {
      document.getElementById("loading").remove();

      const projection = d3.geoNaturalEarth1()
        .fitExtent([[2, titlePad + 4], [mapWidth - 2, mapHeight - 4]], { type: "Sphere" });
      const path = d3.geoPath().projection(projection);

      // Sphere (ocean fill)
      mapG.append("path")
        .datum({ type: "Sphere" })
        .attr("class", "sphere")
        .attr("d", path);

      // Graticule
      mapG.append("path")
        .datum(d3.geoGraticule()())
        .attr("class", "graticule")
        .attr("d", path);

      // Countries
      mapG.append("g")
        .selectAll("path")
        .data(topojson.feature(world, world.objects.countries).features)
        .join("path")
        .attr("class", "country")
        .attr("d", path);

      // Sphere border
      mapG.append("path")
        .datum({ type: "Sphere" })
        .attr("class", "sphere-border")
        .attr("d", path);

      // ── Symbols ───────────────────────────────────────────────────────────
      // Sort largest → smallest so small symbols render on top
      const sorted = hasZ
        ? [...raw].sort((a, b) => (b.z || 0) - (a.z || 0))
        : raw;

      const symbols = mapG.selectAll(".symbol")
        .data(sorted)
        .join("circle")
        .attr("class", "symbol")
        .attr("data-group", d => d.group || "")
        .attr("cx", d => projection([d.x, d.y])?.[0] ?? -999)
        .attr("cy", d => projection([d.x, d.y])?.[1] ?? -999)
        .attr("r", d => getR(d))
        .attr("fill", d => hasGroup ? seriesColor[d.group] : (hasLabel ? seriesColor[d.label] : accentColor))
        .attr("fill-opacity", 0.78)
        .attr("stroke", "#0d1929")
        .attr("stroke-width", 0.8)
        .style("cursor", "default")
        .on("mousemove", showTip)
        .on("mouseleave", () => { tooltip.style.opacity = 0; })
        .on("click", function(event, d) {
          if (!editMode || !hasGroup) return;
          event.stopPropagation();
          openColorPicker(seriesColor[d.group], d.group, event);
        });

      // ── City name labels ─────────────────────────────────────────────────
      if (hasLabel) {
        mapG.selectAll(".point-label")
          .data(sorted)
          .join("text")
          .attr("class", "point-label")
          .attr("x", d => (projection([d.x, d.y])?.[0] ?? -999) + getR(d) + 3)
          .attr("y", d => (projection([d.x, d.y])?.[1] ?? -999) + 3)
          .attr("fill", "#cbd5e1")
          .attr("font-size", "8px")
          .attr("pointer-events", "none")
          .text(d => d.label || "");
      }

      // ── Legend ────────────────────────────────────────────────────────────
      if (hasGroup) {
        const lx = mapWidth + 12;
        const ly = 56; // clear the action buttons (top:16px + ~36px height + gap)
        groupNames.forEach((name, i) => {
          svg.append("circle")
            .attr("class", "legend-dot").attr("data-group", name)
            .attr("cx", lx + 5).attr("cy", ly + i * 22 + 5)
            .attr("r", 5).attr("fill", seriesColor[name]);
          svg.append("text")
            .attr("class", "legend-text")
            .attr("x", lx + 16).attr("y", ly + i * 22 + 9)
            .attr("fill", "#94a3b8").attr("font-size", "12px")
            .text(name);
        });
      }

      // Size legend (if z column)
      if (hasZ) {
        const lx  = mapWidth + 12;
        const ly0 = hasGroup ? 56 + groupNames.length * 22 + 14 : 56;
        const ticks = [zMin + (zMax - zMin) * 0.25, zMin + (zMax - zMin) * 0.6, zMax];
        const lg = svg.append("g").attr("transform", `translate(${lx}, ${ly0})`);
        lg.append("text")
          .attr("x", 0).attr("y", 0)
          .attr("fill", "#64748b").attr("font-size", "11px")
          .text(config.z_label || "Size");
        ticks.forEach((v, i) => {
          const r = rBase(v);
          const yOff = 16 + i * (r * 2 + 8);
          lg.append("circle")
            .attr("cx", 5)
            .attr("cy", yOff + r)
            .attr("r", r)
            .attr("fill", "none")
            .attr("stroke", "#475569")
            .attr("stroke-width", 0.8);
          lg.append("text")
            .attr("x", 16)
            .attr("y", yOff + r + 4)
            .attr("fill", "#64748b")
            .attr("font-size", "10px")
            .text(formatZ(v));
        });
      }

      // ── SVG export ────────────────────────────────────────────────────────
      const SVG_PROPS = [
        "fill", "stroke", "stroke-width", "stroke-dasharray",
        "stroke-opacity", "fill-opacity", "opacity",
        "font-size", "font-family", "font-weight", "text-anchor",
      ];

      function toHex(color) {
        if (!color || color === "none" || color.startsWith("#") || color.startsWith("url(")) return color;
        const m = color.match(/\d+/g);
        if (!m || m.length < 3) return color;
        return "#" + m.slice(0, 3).map(v => parseInt(v).toString(16).padStart(2, "0")).join("");
      }

      function buildExportSVG() {
        const svgEl = document.querySelector("svg");
        const clone = svgEl.cloneNode(true);
        clone.setAttribute("xmlns", "http://www.w3.org/2000/svg");
        clone.setAttribute("width", totalWidth);
        clone.setAttribute("height", totalHeight);

        const srcEls = [...svgEl.querySelectorAll("*")];
        const dstEls = [...clone.querySelectorAll("*")];
        srcEls.forEach((el, i) => {
          const dst = dstEls[i];
          const computed = window.getComputedStyle(el);
          SVG_PROPS.forEach(prop => {
            const val = toHex(el.getAttribute(prop) || computed.getPropertyValue(prop));
            if (val) dst.setAttribute(prop, val);
          });
        });

        const bg = document.createElementNS("http://www.w3.org/2000/svg", "rect");
        bg.setAttribute("width", "100%"); bg.setAttribute("height", "100%");
        bg.setAttribute("fill", svgBg);
        clone.insertBefore(bg, clone.firstChild);
        return new XMLSerializer().serializeToString(clone);
      }

      async function copySVG() {
        const svgStr = buildExportSVG();
        const btn = document.getElementById("btn-copy");
        let ok = false;
        if (location.protocol !== "file:") {
          try {
            const blob = new Blob([svgStr], { type: "image/svg+xml" });
            await navigator.clipboard.write([new ClipboardItem({ "image/svg+xml": blob })]);
            ok = true;
          } catch {}
          if (!ok) { try { await navigator.clipboard.writeText(svgStr); ok = true; } catch {} }
        }
        if (!ok) {
          try {
            const ta = Object.assign(document.createElement("textarea"), { value: svgStr });
            ta.style.cssText = "position:fixed;top:0;left:0;opacity:0;pointer-events:none";
            document.body.appendChild(ta); ta.focus(); ta.select();
            ok = document.execCommand("copy");
            document.body.removeChild(ta);
          } catch {}
        }
        btn.textContent = ok ? "Copied!" : "Failed";
        if (ok) btn.classList.add("success");
        setTimeout(() => { btn.textContent = "Copy SVG"; btn.classList.remove("success"); }, 1500);
      }

      function downloadSVG() {
        const svgStr = buildExportSVG();
        const blob = new Blob([svgStr], { type: "image/svg+xml" });
        const url  = URL.createObjectURL(blob);
        Object.assign(document.createElement("a"), { href: url, download: "chart.svg" }).click();
        URL.revokeObjectURL(url);
      }

      document.getElementById("btn-copy").addEventListener("click", copySVG);
      document.getElementById("btn-download").addEventListener("click", downloadSVG);

      // ── Edit panel ────────────────────────────────────────────────────────
      function isLightBg(hex) {
        const r = parseInt(hex.slice(1,3), 16);
        const g = parseInt(hex.slice(3,5), 16);
        const b = parseInt(hex.slice(5,7), 16);
        return (0.299*r + 0.587*g + 0.114*b) / 255 > 0.5;
      }

      function applyTheme(light) {
        titleEl.attr("fill", light ? "#1e293b" : "#e2e8f0");
        mapG.selectAll(".country").style("fill", light ? "#d1d5db" : "#1e2d42")
          .style("stroke", light ? "#9ca3af" : "#0d1929");
        mapG.selectAll(".sphere").style("fill", light ? "#bfdbfe" : "#0d1929");
        mapG.selectAll(".graticule").style("stroke", light ? "#93c5fd" : "#162035");
        mapG.selectAll(".sphere-border").style("stroke", light ? "#93c5fd" : "#1e2d42");
        svg.selectAll(".legend-text").attr("fill", light ? "#334155" : "#94a3b8");
        // Sync picker values to reflect theme change
        pickLand.value  = toPickerHex(light ? "#d1d5db" : "#1e2d42");
        pickOcean.value = toPickerHex(light ? "#bfdbfe" : "#0d1929");
      }

      const editPanel = document.getElementById("edit-panel");
      const btnEdit   = document.getElementById("btn-edit");
      if (hasGroup) {
        document.getElementById("edit-hint-group").style.display = "";
      }

      btnEdit.addEventListener("click", () => {
        editMode = !editMode;
        editPanel.classList.toggle("open", editMode);
        btnEdit.classList.toggle("active", editMode);
        btnEdit.textContent = editMode ? "Save" : "Edit";
        symbols.style("cursor", editMode && hasGroup ? "pointer" : "default");
      });

      const pickBg = document.getElementById("pick-svg-bg");
      pickBg.value = toPickerHex(svgBg);
      pickBg.addEventListener("input", e => {
        svgBg = e.target.value;
        chartEl.style.background = svgBg;
        applyTheme(isLightBg(svgBg));
      });

      const pickLand = document.getElementById("pick-land");
      pickLand.value = toPickerHex("#1e2d42");
      pickLand.addEventListener("input", e => {
        mapG.selectAll(".country").style("fill", e.target.value);
      });

      const pickOcean = document.getElementById("pick-ocean");
      pickOcean.value = toPickerHex("#0d1929");
      pickOcean.addEventListener("input", e => {
        mapG.selectAll(".sphere").style("fill", e.target.value);
      });

      const STEP = 150, MIN_SIZE = 400 + 64;
      document.getElementById("ep-smaller").addEventListener("click", () => {
        chartEl.style.width = Math.max(MIN_SIZE, chartEl.offsetWidth - STEP) + "px";
      });
      document.getElementById("ep-larger").addEventListener("click", () => {
        chartEl.style.width = (chartEl.offsetWidth + STEP) + "px";
      });

      const pickSymbol = document.getElementById("pick-symbol");
      if (hasGroup) {
        document.getElementById("row-symbol-color").style.display = "none";
      } else {
        pickSymbol.value = toPickerHex(accentColor);
        pickSymbol.addEventListener("input", e => {
          symbols.attr("fill", e.target.value);
        });
      }

      document.getElementById("ep-sym-smaller").addEventListener("click", () => {
        symScale = Math.max(0.3, symScale - 0.2);
        symbols.attr("r", d => getR(d));
      });
      document.getElementById("ep-sym-larger").addEventListener("click", () => {
        symScale = Math.min(4, symScale + 0.2);
        symbols.attr("r", d => getR(d));
      });

      document.getElementById("edit-title").value = config.title || "";
      document.getElementById("edit-title").addEventListener("input", e => titleEl.text(e.target.value));

    }).catch(() => {
      document.getElementById("loading").textContent = "Failed to load map data (requires internet connection)";
    });
  </script>
</body>
</html>
