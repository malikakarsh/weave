services:
  db:
    image: postgres:16
    container_name: weave-postgres
    environment:
      POSTGRES_USER: weave
      POSTGRES_PASSWORD: weave
      POSTGRES_DB: weave
    ports:
      - "5432:5432"
    volumes:
      # Bind mount: DB files live on the host at ./.pgdata (gitignored), so the
      # data is a tangible local copy that survives `docker compose down` and
      # even a volume prune. Delete the folder to reset the database.
      - ./.pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U weave -d weave"]
      interval: 5s
      timeout: 5s
      retries: 5
