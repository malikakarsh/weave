<style>
  .weave-controls {
    display: flex; gap: 32px; flex-wrap: wrap;
    margin-top: 20px; padding-top: 16px;
    border-top: 1px solid #2d3148;
  }
  .wc-item { flex: 1; min-width: 180px; }
  .wc-head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 8px; }
  .wc-label { color: #94a3b8; font-size: 13px; font-weight: 600; }
  .wc-val   { color: #e2e8f0; font-size: 15px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .wc-item input[type="range"] { width: 100%; accent-color: #6366f1; cursor: pointer; }
</style>
<script>
  // Shared runtime for interactive filter sliders. Injected once per chart. A chart
  // provides a `drawData(data)` that redraws from a data payload; this handles the
  // slider UI, the scrub-slice swap, and the min-threshold filter — identically for
  // every chart type.
  window.WeaveControls = (function () {
    const isGroupedList = d => Array.isArray(d) && d.length > 0 && "group" in d[0];

    // Keep marks that pass every active min/max threshold. Each control carries a
    // `field` (x | y | z | measure) telling us WHICH value it filters on — so a
    // "minimum sepal length" slider filters the x column, not the y measure.
    // Threshold state is keyed "min:<col>" / "max:<col>" so a min AND a max on the
    // same column (a range) don't collide.
    const markValue = (d, field) =>
        field === "x" ? d.x
      : field === "z" ? d.z
      : field === "y" ? d.y
      : (d.y ?? d.count ?? d.z ?? d.value ?? d.size ?? null);   // "measure" fallback

    function passesThresholds(v, controls, state) {
      for (const c of ((controls && controls.controls) || [])) {
        if (c.kind !== "min" && c.kind !== "max") continue;
        const val = markValue(v, c.field || "measure");
        if (val === null || val === undefined) continue;   // no such field on this mark
        const t = state[c.kind + ":" + c.column];
        if (c.kind === "min" && val < t) return false;
        if (c.kind === "max" && val > t) return false;
      }
      return true;
    }

    function applyMins(data, controls, state) {
      const active = ((controls && controls.controls) || [])
        .some(c => c.kind === "min" || c.kind === "max");
      if (!active) return data;
      const ok = v => passesThresholds(v, controls, state);
      if (isGroupedList(data)) {
        return data.map(g => ({ ...g, values: g.values.filter(ok) }))
                   .filter(g => g.values.length);
      }
      if (Array.isArray(data)) {
        return data.filter(ok);
      }
      if (data && Array.isArray(data.nodes)) {
        const idOf = x => (x && typeof x === "object") ? x.id : x;
        const keep = new Set(data.nodes.filter(ok).map(n => n.id));
        return {
          nodes: data.nodes.filter(n => keep.has(n.id)),
          links: data.links.filter(l => keep.has(idOf(l.source)) && keep.has(idOf(l.target))),
        };
      }
      return data;
    }

    // Build the slider panel under the chart and wire it to the chart's callbacks.
    // Multiple scrub sliders (e.g. Year + Month) compose: the shown slice is keyed
    // by the JOINED selection of every scrub dimension, so moving either slider
    // calls onScrub with the composite key. Single-scrub keys are the plain value.
    function mount(controls, chartEl, handlers) {
      if (!controls || !controls.controls.length) return;
      const sep = controls.scrub_sep || "\x1f";
      const scrubs = controls.controls.filter(c => c.kind === "scrub");
      const scrubVals = scrubs.map(c => c.default ?? c.values[c.values.length - 1]);
      const compositeKey = () => scrubVals.join(sep);

      const panel = document.createElement("div");
      panel.className = "weave-controls";
      let scrubIdx = 0;
      controls.controls.forEach(c => {
        const item = document.createElement("div"); item.className = "wc-item";
        const head = document.createElement("div"); head.className = "wc-head";
        const lbl  = document.createElement("span"); lbl.className = "wc-label"; lbl.textContent = c.label;
        const val  = document.createElement("span"); val.className = "wc-val";
        head.append(lbl, val);
        const input = document.createElement("input"); input.type = "range";
        if (c.kind === "scrub") {
          const i = scrubIdx++;
          input.min = 0; input.max = c.values.length - 1; input.step = 1;
          const di = Math.max(0, c.values.indexOf(scrubVals[i]));
          input.value = di; val.textContent = c.values[di];
          input.addEventListener("input", () => {
            scrubVals[i] = c.values[+input.value];
            val.textContent = scrubVals[i];
            handlers.onScrub(compositeKey());
          });
        } else {
          // min or max threshold. A max slider starts at the TOP (nothing hidden)
          // and drags down; a min slider starts at 0 and drags up. State key is
          // "<kind>:<col>" so both can coexist on one measure.
          const isMax = c.kind === "max";
          const key = c.kind + ":" + c.column;
          input.min = c.min; input.max = c.max; input.step = c.step;
          input.value = isMax ? c.max : c.min;
          val.textContent = input.value;
          input.addEventListener("input", () => {
            val.textContent = input.value;
            handlers.onMin(key, +input.value);
          });
        }
        item.append(head, input);
        panel.append(item);
      });
      chartEl.append(panel);
    }

    // Initial threshold state, keyed "min:<col>"/"max:<col>". A min starts at its
    // lower bound and a max at its upper bound, so neither hides anything until moved.
    function initMinState(controls) {
      const s = {};
      ((controls && controls.controls) || []).forEach(c => {
        if (c.kind === "min") s["min:" + c.column] = c.min;
        else if (c.kind === "max") s["max:" + c.column] = c.max;
      });
      return s;
    }

    // Axis tick format: honour the configured spec, but if it collapses distinct
    // ticks into DUPLICATE labels (e.g. ",.0f" on 2.5 / 3.0 / 3.5 → "2 / 3 / 4"
    // duplicates), fall back to d3's auto precision so decimals show. Returns a
    // format function suitable for `.tickFormat(...)`.
    function axisFormat(scale, spec, count) {
      const n = count || 6;
      let fmt;
      try { fmt = d3.format(spec); } catch (e) { return scale.tickFormat(n); }
      const labels = scale.ticks(n).map(fmt);
      return new Set(labels).size < labels.length ? scale.tickFormat(n) : fmt;
    }

    return { applyMins, mount, initMinState, axisFormat };
  })();
</script>
