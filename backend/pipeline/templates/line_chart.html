<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #0f1117;
      color: #e2e8f0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding-bottom: 16px;
    }

    #chart {
      position: relative;
      padding: 32px;
      background: #1a1d27;
      border-radius: 16px;
      box-shadow: 0 4px 32px rgba(0,0,0,0.4);
    }

    .chart-actions {
      position: absolute;
      top: 16px;
      right: 16px;
      display: flex;
      gap: 8px;
    }

    .chart-actions button {
      background: #252836;
      color: #94a3b8;
      border: 1px solid #2d3148;
      border-radius: 6px;
      padding: 6px 12px;
      font-size: 12px;
      cursor: pointer;
      transition: background 0.15s, color 0.15s;
    }

    .chart-actions button:hover { background: #2d3148; color: #e2e8f0; }
    .chart-actions button.success { color: #4ade80; border-color: #4ade80; }
    .chart-actions button.active  { color: #e2e8f0; background: #2d3148; }

    #edit-panel {
      display: none;
      position: absolute;
      top: 52px;
      right: 16px;
      background: #252836;
      border: 1px solid #2d3148;
      border-radius: 8px;
      padding: 12px 16px;
      flex-direction: column;
      gap: 10px;
      z-index: 10;
      min-width: 180px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.3);
    }
    #edit-panel.open { display: flex; }
    .edit-row { display: flex; align-items: center; justify-content: space-between; gap: 24px; }
    .edit-label { color: #94a3b8; font-size: 12px; white-space: nowrap; }
    .color-pick {
      width: 32px; height: 22px;
      padding: 1px 2px;
      background: #1a1d27;
      border: 1px solid #2d3148;
      border-radius: 4px;
      cursor: pointer;
    }
    .edit-divider { border-top: 1px solid #2d3148; margin: 2px 0; }
    .edit-btn-group { display: flex; gap: 4px; }
    .edit-btn {
      background: #1a1d27;
      color: #94a3b8;
      border: 1px solid #2d3148;
      border-radius: 4px;
      padding: 3px 10px;
      font-size: 13px;
      cursor: pointer;
    }
    .edit-btn:hover { background: #2d3148; color: #e2e8f0; }
    .edit-hint { color: #475569; font-size: 11px; font-style: italic; }
    .edit-text {
      background: #1a1d27;
      color: #e2e8f0;
      border: 1px solid #2d3148;
      border-radius: 4px;
      padding: 3px 8px;
      font-size: 12px;
      width: 110px;
      outline: none;
    }
    .edit-text:focus { border-color: #4f5680; }

    .axis path, .axis line { stroke: #2d3148; }
    .axis text { fill: #64748b; font-size: 12px; }
    .grid line { stroke: #1e2235; stroke-dasharray: 4 4; }
    .grid path { stroke: none; }
    .line-path { fill: none; stroke-width: 2.5; }
    .area-path { opacity: 0.15; }
    .hover-line { stroke: #475569; stroke-width: 1; stroke-dasharray: 4 4; opacity: 0; }
    .hover-dot { stroke: #1a1d27; stroke-width: 2; opacity: 0; }

    .tooltip {
      position: absolute;
      background: #252836;
      border: 1px solid #2d3148;
      border-radius: 8px;
      padding: 10px 14px;
      font-size: 13px;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.1s;
      min-width: 140px;
    }

    .tooltip .tip-date { color: #64748b; font-size: 11px; margin-bottom: 6px; }
    .tooltip .tip-row { display: flex; align-items: center; gap: 6px; margin-top: 3px; }
    .tooltip .tip-swatch { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
    .tooltip .tip-label { color: #94a3b8; flex: 1; }
    .tooltip .tip-val { color: #e2e8f0; font-weight: 600; }
  </style>
</head>
<body>
  <div id="chart">
    <div class="chart-actions">
      <button id="btn-edit">Edit</button>
      <button id="btn-copy">Copy SVG</button>
      <button id="btn-download">Download SVG</button>
    </div>
    <div id="edit-panel">
      <div class="edit-row">
        <span class="edit-label">SVG Background</span>
        <input type="color" class="color-pick" id="pick-svg-bg">
      </div>
      <div class="edit-divider"></div>
      <div class="edit-row">
        <span class="edit-label">Chart Size</span>
        <div class="edit-btn-group">
          <button class="edit-btn" id="ep-smaller">−</button>
          <button class="edit-btn" id="ep-larger">+</button>
        </div>
      </div>
      <div class="edit-divider"></div>
      <div class="edit-row">
        <span class="edit-label">Title</span>
        <input type="text" class="edit-text" id="edit-title" placeholder="Chart title">
      </div>
      <div class="edit-row">
        <span class="edit-label">X Label</span>
        <input type="text" class="edit-text" id="edit-xlabel" placeholder="x-axis label">
      </div>
      <div class="edit-row">
        <span class="edit-label">Y Label</span>
        <input type="text" class="edit-text" id="edit-ylabel" placeholder="y-axis label">
      </div>
      <div class="edit-divider"></div>
      <span class="edit-hint">Click any line to change its color</span>
    </div>
  </div>
  <input type="color" id="floating-color-pick" style="position:fixed;opacity:0;pointer-events:none;width:0;height:0;left:-200px;top:-200px">
  <div class="tooltip" id="tooltip"></div>

  __CONTROLS_RUNTIME__
  <script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
  <script>
    const raw    = __DATA__;
    const config = __CONFIG__;
    const controls = __CONTROLS__;
    const groupLabel = g => (config.group_labels && config.group_labels[g] != null) ? config.group_labels[g] : g;
    window.__weaveConfig = config;
    const markScale = config.mark_scale || 1;   // multiplier for line stroke thickness

    let svgBg        = config.svg_bg || "#1a1d27";
    let editMode     = false;
    let activeSeries = null;
    let currentSingleColor = config.color;

    const floatingPick = document.getElementById("floating-color-pick");
    floatingPick.addEventListener("input", e => {
      const color = e.target.value;
      if (activeSeries === "__single__") {
        currentSingleColor = color;
        g.selectAll(".line-path").attr("stroke", color);
        g.selectAll(".hover-dot").attr("fill", color);
        svg.selectAll("#area-gradient stop").attr("stop-color", color);
      } else {
        const s = CSS.escape(activeSeries);
        g.selectAll(`.line-path[data-series="${s}"]`).attr("stroke", color);
        g.selectAll(`.hover-dot[data-series="${s}"]`).attr("fill", color);
        svg.selectAll(`.legend-swatch[data-series="${s}"]`).attr("fill", color);
      }
    });

    function highlightSeries(series) {
      g.selectAll(".line-path").each(function () {
        const active = this.getAttribute("data-series") === series;
        d3.select(this)
          .attr("opacity", active ? 1 : 0.12)
          .attr("stroke-width", (active ? 2.5 : 1.5) * markScale);
      });
    }

    function clearHighlight() {
      g.selectAll(".line-path").attr("opacity", 1).attr("stroke-width", 2.5 * markScale);
    }

    function openColorPicker(currentColor, series, event) {
      activeSeries = series;
      floatingPick.value = toPickerHex(currentColor);
      floatingPick.style.left = event.clientX + "px";
      floatingPick.style.top  = event.clientY + "px";
      floatingPick.getBoundingClientRect(); // flush layout so position applies before picker opens
      floatingPick.click();
    }

    function toPickerHex(color) {
      if (/^#[0-9a-f]{6}$/i.test(color)) return color;
      const tmp = Object.assign(document.createElement("div"), { style: `color:${color};position:fixed;opacity:0` });
      document.body.appendChild(tmp);
      const rgb = getComputedStyle(tmp).color;
      document.body.removeChild(tmp);
      const m = rgb.match(/\d+/g);
      return m ? "#" + m.slice(0,3).map(v => (+v).toString(16).padStart(2,"0")).join("") : "#6366f1";
    }

    const parsers = [
      d3.timeParse("%Y-%m-%d"),
      d3.timeParse("%Y/%m/%d"),
      d3.timeParse("%d/%m/%Y"),
      d3.timeParse("%m/%d/%Y"),
      d3.timeParse("%d-%m-%Y"),
      d3.timeParse("%Y-%m-%dT%H:%M:%S"),
      d3.timeParse("%Y-%m-%d %H:%M:%S"),
      d3.timeParse("%d/%m/%Y %H:%M:%S"),
      d3.timeParse("%m/%d/%Y %H:%M:%S"),
    ];

    function parseDate(str) {
      for (const p of parsers) { const d = p(str); if (d) return d; }
      // Fallback for formats like "Jan 1 2000" — only try if string contains letters
      // so bare integers/floats like "1" or "5.1" are not misread as years by new Date()
      if (/[a-zA-Z]/.test(str)) {
        const d = new Date(str);
        if (!isNaN(d.getTime())) return d;
      }
      return null;
    }

    // Detect grouped vs flat
    const isGrouped = raw.length > 0 && "group" in raw[0];

    const firstX     = isGrouped ? raw[0].values[0].x : raw[0].x;
    const isTemporal = parseDate(firstX) !== null;
    const isNumeric  = !isTemporal && !isNaN(parseFloat(firstX));
    const parseX     = v => isTemporal ? parseDate(v) : isNumeric ? parseFloat(v) : v;

    // Interactive-control state (no-op when there are no controls). Guard on
    // NON-EMPTY slices: a min-only control ships slices:{} which is truthy.
    let currentData = raw;
    const minState = window.WeaveControls ? window.WeaveControls.initMinState(controls) : {};
    const _hasSlices = controls && controls.slices && Object.keys(controls.slices).length > 0;
    const allSlices = _hasSlices ? Object.values(controls.slices) : [raw];

    // Normalise a slice to grouped shape, parsed + sorted left-to-right.
    function prep(data) {
      const grouped = data.length > 0 && "group" in data[0];
      const gs = grouped
        ? data.map(gp => ({ group: gp.group, values: gp.values.map(d => ({ x: parseX(d.x), y: d.y })) }))
        : [{ group: null, values: data.map(d => ({ x: parseX(d.x), y: d.y })) }];
      if (isTemporal || isNumeric) gs.forEach(grp => grp.values.sort((a, b) => a.x - b.x));
      return gs;
    }

    // Current slice's series (reassigned by drawSeries; hover reads the latest).
    let groups = prep(raw);

    // Fixed frame + colors from the union of ALL slices, so scrubbing keeps the
    // axes, legend, and each series' color stable; only the paths re-render.
    const unionGroups = allSlices.flatMap(prep);
    const allPoints = unionGroups.flatMap(g => g.values);
    const allGroupKeys = [...new Set(allSlices.flatMap(d => (d.length && "group" in d[0]) ? d.map(g => g.group) : []))];

    // Dimensions — extra right margin for legend when grouped
    const legendWidth = isGrouped ? 130 : 0;
    const margin      = { top: 32, right: 16 + legendWidth, bottom: 64, left: 72 };
    let totalWidth  = config.width;
    let totalHeight = config.height;
    let width  = totalWidth  - margin.left - margin.right;
    let height = totalHeight - margin.top  - margin.bottom;

    // Set outer div width to match SVG + padding
    const chartEl = document.getElementById("chart");
    chartEl.style.width = (totalWidth + 64) + "px";

    const svg = d3.select("#chart")
      .append("svg")
      .attr("viewBox", `0 0 ${totalWidth} ${totalHeight}`)
      .attr("width", totalWidth)
      .attr("height", totalHeight);

    const defs = svg.append("defs");

    // Color scale
    const palette     = config.palette || d3.range(20).map(i => d3.hcl(230 + i * 137.508, 68, 65).formatHex());
    const catColors   = config.category_colors || {};
    function resolveColor(key, fallback) {
      if (catColors[key]) return catColors[key];
      const kl = (key || "").toLowerCase();
      for (const [ck, cv] of Object.entries(catColors)) {
        if (ck.toLowerCase() === kl) return cv;   // exact (case-insensitive) — avoids 'Good' matching 'Very Good'
      }
      return fallback;
    }
    const _baseCS     = allGroupKeys.length
      ? d3.scaleOrdinal(palette).domain(allGroupKeys)
      : () => config.color;
    const colorScale  = key => resolveColor(key, _baseCS(key));

    // Area gradient per group (single only — overlapping areas look messy)
    if (!isGrouped && config.show_area) {
      const grad = defs.append("linearGradient")
        .attr("id", "area-gradient")
        .attr("x1", "0").attr("y1", "0").attr("x2", "0").attr("y2", "1");
      grad.append("stop").attr("offset", "0%")
        .attr("stop-color", config.color).attr("stop-opacity", 0.25);
      grad.append("stop").attr("offset", "100%")
        .attr("stop-color", config.color).attr("stop-opacity", 0);
    }

    const g = svg.append("g").attr("transform", `translate(${margin.left},${margin.top})`);

    // Scales
    const xScale = isTemporal
      ? d3.scaleTime().domain(d3.extent(allPoints, d => d.x)).range([0, width])
      : isNumeric
        ? d3.scaleLinear().domain(d3.extent(allPoints, d => d.x)).range([0, width])
        : d3.scalePoint().domain([...new Set(allPoints.map(d => d.x))]).range([0, width]).padding(0.5);

    const yScale = d3.scaleLinear()
      .domain([0, d3.max(allPoints, d => d.y) * 1.2])
      .range([height, 0]);

    // Grid + axes
    g.append("g").attr("class", "grid")
      .call(d3.axisLeft(yScale).tickSize(-width).tickFormat(""))
      .selectAll("line").attr("stroke", "#1e2235");

    // For temporal axes, pick a tick interval based on the actual date span
    // so we always get ~6 readable ticks regardless of range
    let xAxis;
    if (isTemporal) {
      const [t0, t1] = xScale.domain();
      const years = (t1 - t0) / (1000 * 60 * 60 * 24 * 365.25);
      const interval = years > 20 ? d3.timeYear.every(5)
        : years > 10 ? d3.timeYear.every(2)
        : years > 1  ? d3.timeYear.every(1)
        : years > 0.5 ? d3.timeMonth.every(2)
        : d3.timeMonth.every(1);
      const fmt = years > 1 ? d3.timeFormat("%Y") : d3.timeFormat("%b %Y");
      xAxis = d3.axisBottom(xScale).ticks(interval).tickFormat(fmt);
    } else if (isNumeric) {
      // Integer x (years, ages): integer tick values + no thousands separator, so a
      // year reads "2021", never "2,021.5". Floats keep the default ~6 ticks.
      const xIsInt = allPoints.every(d => Number.isInteger(d.x));
      if (xIsInt) {
        const [x0, x1] = xScale.domain();
        const step = Math.max(1, Math.ceil((x1 - x0) / 6));
        const vals = d3.range(Math.ceil(x0), Math.floor(x1) + 1, step);
        xAxis = d3.axisBottom(xScale).tickValues(vals).tickFormat(d3.format("d"));
      } else {
        xAxis = d3.axisBottom(xScale).ticks(6);
      }
    } else {
      // For categorical x, show at most ~8 evenly spaced tick labels
      const allX = [...new Set(allPoints.map(d => d.x))];
      if (allX.length > 8) {
        const step = Math.ceil(allX.length / 8);
        const shown = new Set(allX.filter((_, i) => i % step === 0));
        xAxis = d3.axisBottom(xScale).tickValues(allX.filter(x => shown.has(x)));
      } else {
        xAxis = d3.axisBottom(xScale);
      }
    }

    const xAxisG = g.append("g").attr("class", "axis")
      .attr("transform", `translate(0,${height})`)
      .call(xAxis);
    xAxisG.selectAll("text")
      .attr("dy", "1.2em")
      .attr("fill", "#64748b")
      .attr("font-size", "12px");
    xAxisG.selectAll("path, line").attr("stroke", "#2d3148");

    const yAxisG = g.append("g").attr("class", "axis")
      .call(d3.axisLeft(yScale).ticks(6).tickFormat(d => d3.format(config.y_format)(d)));
    yAxisG.selectAll("text")
      .attr("fill", "#64748b")
      .attr("font-size", "12px");
    yAxisG.selectAll("path, line").attr("stroke", "#2d3148");

    // Labels — always created so edit panel can update them
    const titleEl = svg.append("text")
      .attr("x", (totalWidth - legendWidth) / 2).attr("y", 18)
      .attr("text-anchor", "middle")
      .attr("fill", "#e2e8f0").attr("font-size", "14px").attr("font-weight", "600")
      .text(config.title || "");

    const _prettify = s => s.replace(/_/g, " ").replace(/([a-z])([A-Z])/g, "$1 $2").trim().replace(/\b\w/g, c => c.toUpperCase());
    const _xLabel = config.x_label || (config.x_column ? _prettify(config.x_column) : isTemporal ? "Date" : isNumeric ? "Value" : "");
    const xLabelEl = svg.append("text")
      .attr("x", margin.left + width / 2).attr("y", totalHeight - 12)
      .attr("text-anchor", "middle").attr("fill", "#64748b").attr("font-size", "12px")
      .text(_xLabel);

    const yLabelEl = svg.append("text")
      .attr("transform", "rotate(-90)")
      .attr("x", -(margin.top + height / 2)).attr("y", 14)
      .attr("text-anchor", "middle").attr("fill", "#64748b").attr("font-size", "12px")
      .text(config.y_label || "");

    // Curve
    const CURVES = {
      monotoneX: d3.curveMonotoneX, linear: d3.curveLinear,
      step: d3.curveStep, natural: d3.curveNatural, cardinal: d3.curveCardinal,
    };
    const curve = CURVES[config.curve] ?? d3.curveMonotoneX;

    const lineGen = d3.line()
      .defined(d => d.y !== null)
      .x(d => xScale(d.x))
      .y(d => yScale(d.y))
      .curve(curve);

    const areaGen = d3.area()
      .defined(d => d.y !== null)
      .x(d => xScale(d.x))
      .y0(height).y1(d => yScale(d.y))
      .curve(curve);

    // Fixed layers (bottom→top): series paths, then hover line/dots, then the
    // pointer overlay — so redrawing the series on a slider change never covers
    // the hover surface.
    const seriesLayer = g.append("g").attr("class", "series-layer");
    const hoverLayer  = g.append("g").attr("class", "hover-layer");

    const hoverLine = hoverLayer.append("line")
      .attr("class", "hover-line").attr("y1", 0).attr("y2", height);

    const bisect  = d3.bisector(d => d.x).center;
    const tooltip = document.getElementById("tooltip");
    const formatY = d3.format(",.2f");
    const formatX = isTemporal ? d3.timeFormat("%b %d, %Y") : d => d;
    const xKey = v => isTemporal ? +v : v;

    // Rebuilt on every draw; the hover closures read the latest.
    let hoverDots = [];
    let xRef = [];

    // Draw the series for one data payload — re-callable so a slider change swaps
    // paths/dots without touching the fixed frame (scales, axes, legend).
    function drawSeries(data) {
      const filtered = window.WeaveControls
        ? window.WeaveControls.applyMins(data, controls, minState) : data;
      groups = prep(filtered);

      seriesLayer.selectAll("*").remove();
      hoverLayer.selectAll(".hover-dot").remove();

      groups.forEach(grp => {
        const color = colorScale(grp.group);

        if (!isGrouped && config.show_area) {
          seriesLayer.append("path").datum(grp.values)
            .attr("class", "area-path")
            .attr("fill", "url(#area-gradient)")
            .attr("d", areaGen);
        }

        seriesLayer.append("path").datum(grp.values)
          .attr("class", "line-path")
          .attr("data-series", grp.group ?? "__single__")
          .attr("stroke", color)
          .attr("stroke-width", 2.5 * markScale)
          .attr("d", lineGen);

        // Wide transparent overlay for easy clicking in edit mode
        seriesLayer.append("path").datum(grp.values)
          .attr("class", "line-hit")
          .attr("data-series", grp.group ?? "__single__")
          .attr("stroke", "transparent")
          .attr("stroke-width", 20)
          .attr("fill", "none")
          .attr("cursor", "default")  // overridden to "pointer" when edit mode is active
          .attr("d", lineGen)
          .on("click", function(event) {
            if (!editMode) return;
            event.stopPropagation();
            const series   = this.getAttribute("data-series");
            const linePath = g.select(`.line-path[data-series="${CSS.escape(series)}"]`);
            highlightSeries(series);
            openColorPicker(linePath.attr("stroke"), series, event);
          });
      });

      hoverDots = groups.map(grp =>
        hoverLayer.append("circle")
          .attr("class", "hover-dot")
          .attr("data-series", grp.group ?? "__single__")
          .attr("r", 5)
          .attr("fill", colorScale(grp.group))
      );

      // Canonical x reference = the UNION of every group's x values in the CURRENT
      // slice, so the hovered year snaps against all visible data, not just
      // groups[0] — a series missing an x the others have would shift every label.
      const xUnionM = new Map();
      groups.flatMap(gp => gp.values).forEach(d => {
        const k = xKey(d.x);
        if (!xUnionM.has(k)) xUnionM.set(k, d.x);
      });
      xRef = [...xUnionM.values()]
        .sort((a, b) => (isTemporal || isNumeric) ? xKey(a) - xKey(b) : d3.ascending(a, b))
        .map(x => ({ x }));

      if (typeof applyTheme === "function") applyTheme(isLightBg(svgBg));
    }

    // Legend (grouped only) — built once from the union of series
    if (isGrouped) {
      const lx = margin.left + width + 20;
      const ly = margin.top;
      allGroupKeys.forEach((gk, i) => {
        svg.append("rect")
          .attr("class", "legend-swatch").attr("data-series", gk)
          .attr("x", lx).attr("y", ly + i * 22)
          .attr("width", 10).attr("height", 10).attr("rx", 2)
          .attr("fill", colorScale(gk));
        svg.append("text")
          .attr("class", "legend-text")
          .attr("x", lx + 16).attr("y", ly + i * 22 + 9)
          .attr("fill", "#94a3b8").attr("font-size", "12px")
          .text(groupLabel(gk));
      });
    }

    const hoverOverlay = g.append("rect")
      .attr("width", width).attr("height", height)
      .attr("fill", "none").attr("pointer-events", "all")
      .on("mousemove", function(event) {
        const [mx] = d3.pointer(event);
        const xVal = (isTemporal || isNumeric) ? xScale.invert(mx) : null;

        // Snap against the union of all x values so the label matches every group
        const idx = (isTemporal || isNumeric)
          ? bisect(xRef, xVal)
          : Math.round((mx / width) * (xRef.length - 1));
        const safeIdx = Math.max(0, Math.min(idx, xRef.length - 1));

        const targetX = xRef[safeIdx].x;
        const targetK = xKey(targetX);
        const cx = xScale(targetX);
        hoverLine.attr("x1", cx).attr("x2", cx).attr("opacity", 1);

        // Each group shows its value AT the snapped x (null if it has no such point),
        // so every row in the tooltip corresponds to the same year in the header.
        const groupPts = groups.map(grp =>
          grp.values.find(d => xKey(d.x) === targetK) ?? null
        );

        // Position dots
        groups.forEach((grp, i) => {
          const pt = groupPts[i];
          if (pt && pt.y !== null) {
            hoverDots[i].attr("cx", cx).attr("cy", yScale(pt.y)).attr("opacity", 1);
          } else {
            hoverDots[i].attr("opacity", 0);
          }
        });

        // Build tooltip
        let html = `<div class="tip-date">${formatX(targetX)}</div>`;
        groups.forEach((grp, i) => {
          const pt  = groupPts[i];
          const val = pt && pt.y !== null ? formatY(pt.y) : "—";
          const col = colorScale(grp.group);
          const lbl = isGrouped ? groupLabel(grp.group) : "Value";
          html += `<div class="tip-row">
            <span class="tip-swatch" style="background:${col}"></span>
            <span class="tip-label">${lbl}</span>
            <span class="tip-val">${val}</span>
          </div>`;
        });
        tooltip.innerHTML = html;

        const chartRect = document.getElementById("chart").getBoundingClientRect();
        const vpW = document.documentElement.clientWidth;
        const vpH = document.documentElement.clientHeight;
        const _ttW = tooltip.offsetWidth || 180;
        const _ttH = tooltip.offsetHeight || 120;
        const anchorX = chartRect.left + margin.left + cx;
        // Horizontally sit beside the guide line (flip to its left near the right
        // edge); vertically FOLLOW THE CURSOR rather than a series' data value, so the
        // box never lands on top of the pointer. Both axes clamp inside the viewport.
        let ttLeft = anchorX + 14;
        if (ttLeft + _ttW > vpW - 8) ttLeft = anchorX - _ttW - 14;
        ttLeft = Math.max(8, Math.min(ttLeft, vpW - _ttW - 8));
        let ttTop = event.clientY + 16;
        if (ttTop + _ttH > vpH - 8) ttTop = event.clientY - _ttH - 16;
        ttTop = Math.max(8, Math.min(ttTop, vpH - _ttH - 8));
        tooltip.style.left    = `${ttLeft}px`;
        tooltip.style.top     = `${ttTop}px`;
        tooltip.style.opacity = 1;
      })
      .on("mouseleave", () => {
        hoverLine.attr("opacity", 0);
        hoverDots.forEach(d => d.attr("opacity", 0));
        tooltip.style.opacity = 0;
      });

    // Initial draw + slider wiring
    drawSeries(currentData);
    if (window.WeaveControls) window.WeaveControls.mount(controls, chartEl, {
      onScrub: v => { currentData = (controls.slices[v] || []); drawSeries(currentData); },
      onMin:  (col, v) => { minState[col] = v; drawSeries(currentData); },
    });

    // --- SVG export ---
    const SVG_PROPS = [
      "fill", "stroke", "stroke-width", "stroke-dasharray", "stroke-linecap",
      "stroke-opacity", "fill-opacity", "opacity", "font-size", "font-family",
      "font-weight", "text-anchor", "dominant-baseline",
    ];

    // PowerPoint's SVG renderer doesn't support rgb() in presentation attributes — needs hex
    function toHex(color) {
      if (!color || color === "none" || color.startsWith("#") || color.startsWith("url(")) return color;
      const m = color.match(/\d+/g);
      if (!m || m.length < 3) return color;
      return "#" + m.slice(0, 3).map(v => parseInt(v).toString(16).padStart(2, "0")).join("");
    }

    function buildExportSVG() {
      const svgEl = document.querySelector("svg");
      const clone = svgEl.cloneNode(true);
      clone.setAttribute("xmlns", "http://www.w3.org/2000/svg");
      clone.setAttribute("width", totalWidth);
      clone.setAttribute("height", totalHeight);

      // Query BEFORE inserting bg — inserting bg shifts dstEls indices by 1
      const srcEls = [...svgEl.querySelectorAll("*")];
      const dstEls = [...clone.querySelectorAll("*")];

      srcEls.forEach((el, i) => {
        const dst     = dstEls[i];
        const computed = window.getComputedStyle(el);

        SVG_PROPS.forEach(prop => {
          // Prefer the element's own presentation attribute (set by D3's .attr())
          // over the computed CSS value — both paths end up as presentation attributes
          // so PowerPoint handles them reliably instead of ignoring inline CSS.
          const raw = el.getAttribute(prop) || computed.getPropertyValue(prop);
          const val = toHex(raw);
          if (val) dst.setAttribute(prop, val);
        });

        // url() gradient refs don't survive SVG export — flatten to solid + opacity
        const fill = dst.getAttribute("fill") || "";
        if (fill.startsWith("url(")) {
          dst.setAttribute("fill", currentSingleColor);
          dst.setAttribute("fill-opacity", "0.12");
        }
      });

      // Insert bg after styling so it doesn't skew indices above
      const bg = document.createElementNS("http://www.w3.org/2000/svg", "rect");
      bg.setAttribute("width", "100%");
      bg.setAttribute("height", "100%");
      bg.setAttribute("fill", svgBg);
      clone.insertBefore(bg, clone.firstChild);

      clone.querySelectorAll(".hover-line, .hover-dot").forEach(el => el.remove());
      return new XMLSerializer().serializeToString(clone);
    }

    async function copySVG() {
      const svgStr = buildExportSVG();
      const btn = document.getElementById("btn-copy");
      let ok = false;

      // Clipboard API silently fails on file:// (not a secure context) — skip it
      if (location.protocol !== "file:") {
        try {
          const blob = new Blob([svgStr], { type: "image/svg+xml" });
          await navigator.clipboard.write([new ClipboardItem({ "image/svg+xml": blob })]);
          ok = true;
        } catch {}

        if (!ok) {
          try { await navigator.clipboard.writeText(svgStr); ok = true; } catch {}
        }
      }

      if (!ok) {
        try {
          const ta = Object.assign(document.createElement("textarea"), { value: svgStr });
          ta.style.cssText = "position:fixed;top:0;left:0;opacity:0;pointer-events:none";
          document.body.appendChild(ta);
          ta.focus();
          ta.select();
          ok = document.execCommand("copy");
          document.body.removeChild(ta);
        } catch {}
      }

      btn.textContent = ok ? "Copied!" : "Failed";
      if (ok) btn.classList.add("success");
      setTimeout(() => { btn.textContent = "Copy SVG"; btn.classList.remove("success"); }, 1500);
    }

    function downloadSVG() {
      const svgStr = buildExportSVG();
      const blob = new Blob([svgStr], { type: "image/svg+xml" });
      const url  = URL.createObjectURL(blob);
      const a    = document.createElement("a");
      a.href = url; a.download = "chart.svg"; a.click();
      URL.revokeObjectURL(url);
    }

    document.getElementById("btn-copy").addEventListener("click", copySVG);
    document.getElementById("btn-download").addEventListener("click", downloadSVG);

    // --- Edit panel ---
    const editPanel = document.getElementById("edit-panel");
    const btnEdit   = document.getElementById("btn-edit");
    btnEdit.addEventListener("click", () => {
      editMode = !editMode;
      editPanel.classList.toggle("open", editMode);
      btnEdit.classList.toggle("active", editMode);
      btnEdit.textContent = editMode ? "Save" : "Edit";
      hoverOverlay.attr("pointer-events", editMode ? "none" : "all");
      g.selectAll(".line-hit").style("cursor", editMode ? "pointer" : "default");
      if (!editMode) clearHighlight();
      // Clear selection when clicking empty chart area
      svg.on("click", editMode ? () => clearHighlight() : null);
    });

    // SVG background picker + auto-contrast
    function isLightBg(hex) {
      const r = parseInt(hex.slice(1,3), 16);
      const g = parseInt(hex.slice(3,5), 16);
      const b = parseInt(hex.slice(5,7), 16);
      return (0.299*r + 0.587*g + 0.114*b) / 255 > 0.5;
    }

    function applyTheme(light) {
      const titleColor  = light ? "#1e293b" : "#e2e8f0";
      const labelColor  = light ? "#475569" : "#64748b";
      const axisColor   = light ? "#cbd5e1" : "#2d3148";
      const gridColor   = light ? "#d1d5db" : "#1e2235";
      const legendColor = light ? "#334155" : "#94a3b8";
      titleEl.attr("fill", titleColor);
      xLabelEl.attr("fill", labelColor);
      yLabelEl.attr("fill", labelColor);
      xAxisG.selectAll("text").attr("fill", labelColor);
      yAxisG.selectAll("text").attr("fill", labelColor);
      xAxisG.selectAll("path, line").attr("stroke", axisColor);
      yAxisG.selectAll("path, line").attr("stroke", axisColor);
      g.selectAll(".grid line").attr("stroke", gridColor);
      svg.selectAll(".legend-text").attr("fill", legendColor);
    }

    const pickBg = document.getElementById("pick-svg-bg");
    pickBg.value = toPickerHex(svgBg);
    pickBg.addEventListener("input", e => {
      svgBg = e.target.value;
      chartEl.style.background = svgBg;
      applyTheme(isLightBg(svgBg));
    });

    // Chart size
    const STEP = 150, MIN_SIZE = 400 + 64;
    function resize(delta) {
      chartEl.style.width = Math.max(MIN_SIZE, chartEl.offsetWidth + delta) + "px";
    }
    document.getElementById("ep-smaller").addEventListener("click", () => resize(-STEP));
    document.getElementById("ep-larger").addEventListener("click",  () => resize(+STEP));

    // Title / axis labels
    const editTitleEl  = document.getElementById("edit-title");
    const editXLabelEl = document.getElementById("edit-xlabel");
    const editYLabelEl = document.getElementById("edit-ylabel");
    editTitleEl.value  = config.title   || "";
    editXLabelEl.value = _xLabel;
    editYLabelEl.value = config.y_label || "";
    editTitleEl.addEventListener("input",  e => titleEl.text(e.target.value));
    editXLabelEl.addEventListener("input", e => xLabelEl.text(e.target.value));
    requestAnimationFrame(() => {
      window.parent.postMessage({ type: "weave-height", height: document.body.scrollHeight }, "*");
    });
    editYLabelEl.addEventListener("input", e => yLabelEl.text(e.target.value));
  </script>
</body>
</html>
